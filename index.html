<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Ingressi festa</title>

<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap"
  rel="stylesheet"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
window.jsQR || document.write(
  '<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"><\/script>'
);
</script>


<style>

:root{

  --bg:#F6F3FF;
  --card:#fff;
  --ink:#1E1B3A;
  --mut:#6B6890;
  --line:#DDD8F2;

  --acc:#D62D6A;
  --onacc:#fff;

  --ok:#0F7A55;
  --okbg:#D6F4E6;

  --bad:#B3243A;
  --badbg:#FCDDE2;

  box-sizing:border-box;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}


/* ============================================================
   COLORI ORGANIZZATORI
   ============================================================ */

body.Anuraj{

  --acc:#7C3AED;

}


body.Molly{

  --acc:#1677FF;

}


body.admin{

  --acc:#D62D6A;

}


/* DARK MODE */

@media (prefers-color-scheme:dark){

  :root:not([data-theme="light"]){

    --bg:#15132B;
    --card:#211E42;
    --ink:#F2EFFF;
    --mut:#A9A5CF;
    --line:#38346A;

    --acc:#FF5C8A;
    --onacc:#1B0A12;

    --ok:#5EE0A8;
    --okbg:#0F3A2B;

    --bad:#FF8A9B;
    --badbg:#4A1622;

  }

}


:root[data-theme="dark"]{

  --bg:#15132B;
  --card:#211E42;
  --ink:#F2EFFF;
  --mut:#A9A5CF;
  --line:#38346A;

  --acc:#FF5C8A;
  --onacc:#1B0A12;

  --ok:#5EE0A8;
  --okbg:#0F3A2B;

  --bad:#FF8A9B;
  --badbg:#4A1622;
}


html{

  scroll-padding-top:env(safe-area-inset-top,0px);

}


*,
*::before,
*::after{

  box-sizing:inherit;

}


body{

  margin:0;

  background:var(--bg);

  color:var(--ink);

  font:
    16px/1.45
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

}


main{

  max-width:560px;

  margin:0 auto;

  padding:18px 16px 40px;

}


h1{

  font:
    800 30px/1.1
    "Bricolage Grotesque",
    system-ui,
    sans-serif;

  margin:0 0 6px;

}


.stats{

  color:var(--mut);

  font-size:14px;

  margin-bottom:16px;

}


.stats b{

  color:var(--ink);

}


.userBadge{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:5px 10px;

  border-radius:999px;

  background:var(--acc);

  color:var(--onacc);

  font-size:12px;

  font-weight:800;

  margin-bottom:10px;

}


nav{

  display:flex;

  gap:6px;

  margin-bottom:16px;

}


nav button{

  flex:1;

  padding:12px;

  border:
    1.5px solid
    var(--line);

  background:var(--card);

  color:var(--ink);

  border-radius:12px;

  font:
    600 15px
    system-ui;

}


nav button.on{

  background:var(--acc);

  color:var(--onacc);

  border-color:var(--acc);

}


.box{

  background:var(--card);

  border:
    1px solid
    var(--line);

  border-radius:16px;

  padding:14px;

  margin-bottom:14px;

}


label{

  display:block;

  font-size:13px;

  color:var(--mut);

  margin:8px 0 4px;

}


input{

  width:100%;

  padding:12px;

  font:inherit;

  background:var(--bg);

  color:var(--ink);

  border:
    1.5px solid
    var(--line);

  border-radius:10px;

}


input:focus,
button:focus-visible{

  outline:
    3px solid
    var(--acc);

  outline-offset:1px;

}


.row{

  display:flex;

  gap:8px;

}


.row>*{

  flex:1;

}


.btn{

  padding:12px 16px;

  border:0;

  border-radius:12px;

  background:var(--acc);

  color:var(--onacc);

  font:
    700 16px
    system-ui;

  cursor:pointer;

}


.btn.g{

  background:transparent;

  color:var(--ink);

  border:
    1.5px solid
    var(--line);

}


.btn.s{

  padding:8px 12px;

  font-size:14px;

}


.btn.full{

  width:100%;

  margin-top:12px;

}


.btn:disabled{

  opacity:.5;

}


.msg{

  min-height:20px;

  margin-top:8px;

  font-size:14px;

  color:var(--bad);

}


.it{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:8px 10px;

  padding:12px 0;

  border-top:
    1px solid
    var(--line);

}


.it:first-child{

  border-top:0;

}


.who{

  flex:
    1 1 60%;

  min-width:0;

}


.who b{

  display:block;

}


.who span{

  font-size:13px;

  color:var(--mut);

}


.pp{

  font:
    800 18px
    "Bricolage Grotesque",
    system-ui,
    sans-serif;

  min-width:44px;

  text-align:right;

}


.acts{

  display:flex;

  gap:6px;

  width:100%;

}


.it.off{

  opacity:.5;

}


.it.off .who b{

  text-decoration:line-through;

}


.done{

  color:var(--ok);

}


#vid{

  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  background:#000;

  border-radius:16px;

  display:block;

}


.res{

  border-radius:16px;

  padding:20px;

  margin-top:14px;

  text-align:center;

}


.res.ok{

  background:var(--okbg);

  color:var(--ok);

}


.res.bad{

  background:var(--badbg);

  color:var(--bad);

}


.res h2{

  margin:0 0 8px;

  font:
    800 28px/1.1
    "Bricolage Grotesque",
    system-ui,
    sans-serif;

}


.res p{

  margin:4px 0;

  color:var(--ink);

}


.ov{

  position:fixed;

  inset:0;

  background:rgba(10,8,30,.7);

  display:none;

  align-items:center;

  justify-content:center;

  padding:16px;

  z-index:9;

}


.ov.on{

  display:flex;

}


.pop{

  background:var(--card);

  border-radius:18px;

  padding:14px;

  max-width:420px;

  width:100%;

  max-height:100%;

  overflow:auto;

  text-align:center;

}


.pop img{

  width:100%;

  border-radius:10px;

  background:#fff;

}


.hint{

  font-size:13px;

  color:var(--mut);

  margin:8px 0;

}


.money{

  font-weight:800;

  color:var(--ok);

}


.payBox{

  margin-top:10px;

  padding:10px;

  background:var(--bg);

  border-radius:12px;

}


.payRow{

  display:flex;

  align-items:center;

  gap:8px;

}


.payRow input[type="checkbox"]{

  width:22px;

  height:22px;

  flex:0 0 auto;

}


.amountInput{

  margin-top:8px;

}


.totalBox{

  margin-bottom:12px;

  padding:14px;

  border-radius:14px;

  background:var(--card);

  border:1px solid var(--line);

}


.totalBox strong{

  font-size:22px;

}


[hidden]{

  display:none!important;

}

</style>

</head>


<body>

<main>


  <div
    class="userBadge"
    id="userBadge"
    hidden
  >
    —
  </div>


  <h1>Ingressi festa</h1>


  <div
    class="stats"
    id="stats"
  >
    Caricamento…
  </div>


  <div
    class="msg"
    id="top"
  ></div>


  <nav
    id="nav"
    hidden
  >

    <button
      data-tab="list"
      class="on"
    >
      Prenotazioni
    </button>

    <button
      data-tab="scan"
    >
      Scanner
    </button>

  </nav>


  <section
    id="list"
    hidden
  >


    <div class="box">


      <label for="nm">
        Nome di chi prenota (persona 1)
      </label>


      <input
        id="nm"
        placeholder="Paolo Rossi"
      >


      <div class="row">


        <div>

          <label for="ph">
            Telefono
          </label>

          <input
            id="ph"
            type="tel"
            inputmode="tel"
            placeholder="333 1234567"
          >

        </div>


        <div>

          <label for="pe">
            Persone
          </label>

          <input
            id="pe"
            type="number"
            min="1"
            max="50"
            value="1"
            inputmode="numeric"
          >

        </div>


      </div>


      <div id="names"></div>


      <button
        class="btn full"
        id="add"
      >
        Crea prenotazione e QR
      </button>


      <div
        class="msg"
        id="fmsg"
      ></div>


    </div>


    <div
      class="totalBox"
      id="totalBox"
      hidden
    >
      <div>Totale incassato</div>

      <strong id="totalCollected">
        € 0,00
      </strong>
    </div>


    <input
      id="q"
      type="search"
      placeholder="Cerca per nome, telefono o codice"
      hidden
    >


    <div
      class="box"
      id="items"
      style="margin-top:12px"
    ></div>


  </section>


  <section
    id="scan"
    hidden
  >


    <video
      id="vid"
      playsinline
      muted
    ></video>


    <p
      class="hint"
      id="cam"
    ></p>


    <label
      class="btn g s"
      style="display:block;text-align:center;margin:0"
    >

      Scatta foto del QR

      <input
        id="pic"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      >

    </label>


    <div
      class="row"
      style="margin-top:10px"
    >

      <input
        id="man"
        placeholder="Codice a 4 cifre"
        inputmode="numeric"
        maxlength="4"
      >

      <button
        class="btn s"
        id="manGo"
        style="flex:0 0 auto"
      >
        Verifica
      </button>

    </div>


    <div id="res"></div>


  </section>


</main>


<div
  class="ov"
  id="ov"
>

  <div class="pop">


    <img
      id="qimg"
      alt="QR della prenotazione"
    >


    <p class="hint">
      Tieni premuto sull'immagine per salvarla
      o inviarla su WhatsApp.
    </p>


    <div class="row">


      <button
        class="btn s"
        id="share"
      >
        Condividi
      </button>


      <button
        class="btn g s"
        id="close"
      >
        Chiudi
      </button>


    </div>


  </div>

</div>


<script>


/* ============================================================
   CONFIG
   ============================================================ */

const API =
  'https://script.google.com/macros/s/AKfycbxO-R2yW13gYo4jHB-rls7jxcv-GDUsv8jsaFsWVwkTLRmrkc4RRERwDSSPU8HUMLov/exec';


let K = null;

let ME = null;

let L = [];

let FREE = 0;

let USED = 0;

let CAP = 180;

let COLLECTED = 0;

let cur = null;


/* ============================================================
   UTILITÀ
   ============================================================ */

const $ =
  id => document.getElementById(id);


const esc =
  s => String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


const money =
  n =>
    new Intl.NumberFormat(
      'it-IT',
      {
        style:'currency',
        currency:'EUR'
      }
    ).format(
      Number(n || 0)
    );


/* ============================================================
   CHIAVE
   ============================================================ */

(function(){

  const p =
    new URLSearchParams(
      location.search
    ).get('k');


  if(p){

    try{

      localStorage.setItem(
        'k',
        p
      );

    }catch(e){}


    history.replaceState(
      null,
      '',
      location.pathname
    );
  }


  try{

    K =
      p ||
      localStorage.getItem('k');

  }catch(e){

    K = p;

  }

})();


/* ============================================================
   API
   ============================================================ */

async function api(
  action,
  d
){

  const body =
    JSON.stringify(
      Object.assign(
        {
          key:K,
          action,

          rid:
            Date.now().toString(36) +
            Math.random()
              .toString(36)
              .slice(2,8)

        },
        d || {}
      )
    );


  let last =
    '';


  for(
    let i=0;
    i<3;
    i++
  ){

    let r;

    let t;

    let j;


    try{

      r =
        await fetch(
          API,
          {
            method:'POST',
            body
          }
        );


      t =
        await r.text();


    }catch(e){

      last =
        'Nessuna connessione a Google';

      await new Promise(
        r =>
          setTimeout(
            r,
            500 * (i+1)
          )
      );

      continue;
    }


    try{

      j =
        JSON.parse(t);


    }catch(e){

      last =
        'Google non ha risposto correttamente (codice ' +
        r.status +
        ')';

      await new Promise(
        r =>
          setTimeout(
            r,
            500 * (i+1)
          )
      );

      continue;
    }


    if(!j.ok){

      throw new Error(
        j.error ||
        'Errore'
      );

    }


    return j;
  }


  throw new Error(
    last +
    '. Riprova tra qualche secondo.'
  );
}


/* ============================================================
   REFRESH LEGGERO
   ============================================================ */

async function refresh(){

  const j =
    await api('list');


  L =
    j.list || [];


  FREE =
    j.free || 0;


  USED =
    j.used || 0;


  COLLECTED =
    j.collected || 0;


  render();
}


/* ============================================================
   INIT
   ============================================================ */

async function init(){

  if(!K){

    $('stats').textContent='';

    $('top').textContent =
      'Link non valido. Chiedi il link giusto a chi organizza.';

    return;
  }


  try{

    const j =
      await api('whoami');


    ME =
      j;


    CAP =
      j.capacity;


    /*
      Colore pagina.
    */

    document.body.classList.remove(
      'admin',
      'anuraj',
      'molly'
    );


    if(
      j.name &&
      j.name.toLowerCase() === 'anuraj'
    ){

      document.body.classList.add(
        'anuraj'
      );

    }
    else if(
      j.name &&
      j.name.toLowerCase() === 'molly'
    ){

      document.body.classList.add(
        'molly'
      );

    }
    else{

      document.body.classList.add(
        'admin'
      );

    }


    /*
      Nome in testata.
    */

    $('userBadge').textContent =
      j.role === 'admin'
        ? 'ADMIN'
        : j.name.toUpperCase();


    $('userBadge').hidden =
      false;


    $('list').hidden =
      false;


    if(j.role === 'admin'){

      $('nav').hidden =
        false;

      $('q').hidden =
        false;

      $('totalBox').hidden =
        false;
    }


    await refresh();


  }catch(e){

    $('stats').textContent='';

    $('top').textContent =
      e.message;

  }
}


/* ============================================================
   RENDER
   ============================================================ */

function render(){

  if(!ME) return;


  const admin =
    ME.role === 'admin';


  const q =
    admin
      ? $('q').value
          .trim()
          .toLowerCase()
      : '';


  const ent =
    L
      .filter(
        b => !b.cancelled
      )
      .reduce(
        (t,b) =>
          t +
          b.att.filter(
            a => a.e
          ).length,
        0
      );


  $('stats').innerHTML =
    admin
      ? `
        Prenotati <b>${USED}</b>
        su ${CAP}
        · Entrati <b>${ent}</b>
        · Liberi <b>${FREE}</b>
      `
      : `
        Posti ancora liberi:
        <b>${FREE}</b>
      `;


  if(admin){

    $('totalCollected').textContent =
      money(COLLECTED);

  }


  const R =
    L
      .filter(
        b =>
          !q ||
          (
            b.name +
            ' ' +
            b.phone +
            ' ' +
            b.code +
            ' ' +
            b.att
              .map(a => a.n)
              .join(' ')
          )
          .toLowerCase()
          .includes(q)
      )
      .slice()
      .reverse();


  $('items').innerHTML =
    R.length
      ? R.map(
          b => {

            const n =
              b.att.length;


            const e =
              b.att.filter(
                a => a.e
              ).length;


            return `

              <div
                class="it ${b.cancelled?'off':''}"
              >

                <div class="who">

                  <b>
                    ${esc(
                      b.name ||
                      b.phone
                    )}
                  </b>

                  <span>

                    ${esc(b.phone)}

                    ·

                    ${n}
                    ${n==1?'persona':'persone'}

                    ·

                    Codice
                    <strong>
                      ${esc(b.code)}
                    </strong>

                    ${
                      admin
                        ? (
                          b.paid
                            ? ` · <span class="money">pagato ${money(b.amount)}</span>`
                            : ' · da pagare'
                        )
                        : ''
                    }

                    ${
                      n>1
                        ? '<br>' +
                          esc(
                            b.att
                              .map(
                                a =>
                                  (a.e?'✓ ':'') +
                                  (a.n||'senza nome')
                              )
                              .join(', ')
                          )
                        : ''
                    }

                  </span>

                </div>


                ${
                  admin
                    ? `
                      <div
                        class="pp ${e>=n&&!b.cancelled?'done':''}"
                      >
                        ${e}/${n}
                      </div>
                    `
                    : ''
                }


                <div class="acts">


                  <button
                    class="btn s"
                    data-a="qr"
                    data-c="${esc(b.code)}"
                    ${b.cancelled?'hidden':''}
                  >
                    QR
                  </button>


                  ${
                    admin
                      ? `

                        <button
                          class="btn g s"
                          data-a="paid"
                          data-c="${esc(b.code)}"
                        >
                          ${
                            b.paid
                              ? 'Modifica pagamento'
                              : 'Segna pagato'
                          }
                        </button>


                        <button
                          class="btn g s"
                          data-a="tog"
                          data-c="${esc(b.code)}"
                        >
                          ${
                            b.cancelled
                              ? 'Ripristina'
                              : 'Annulla'
                          }
                        </button>

                      `
                      : ''
                  }


                </div>


              </div>
            `;

          }
        ).join('')


      : `
        <p
          class="hint"
          style="margin:0"
        >
          Nessuna prenotazione.
        </p>
      `;
}


/* ============================================================
   RICERCA
   ============================================================ */

$('q').oninput =
  render;


/* ============================================================
   NOMI
   ============================================================ */

function renderNames(){

  const n =
    Math.max(
      1,
      Math.min(
        50,
        parseInt(
          $('pe').value,
          10
        ) || 1
      )
    );


  const old =
    [
      ...document.querySelectorAll(
        '.nx'
      )
    ].map(
      i => i.value
    );


  $('names').innerHTML =
    Array.from(
      {
        length:
          n - 1
      },
      (_,i) => `

        <label>
          Persona ${i+2}
        </label>

        <input
          class="nx"
          placeholder="Nome"
          value="${esc(
            old[i] || ''
          )}"
        >

      `
    ).join('');
}


$('pe').oninput =
  renderNames;


renderNames();


/* ============================================================
   CREA PRENOTAZIONE
   ============================================================ */

$('add').onclick =
  async () => {

    const m =
      $('fmsg');


    const btn =
      $('add');


    const n =
      Math.max(
        1,
        Math.min(
          50,
          parseInt(
            $('pe').value,
            10
          ) || 1
        )
      );


    const names =
      [
        $('nm').value.trim(),
        ...[
          ...document.querySelectorAll(
            '.nx'
          )
        ].map(
          i => i.value.trim()
        )
      ].slice(
        0,
        n
      );


    while(
      names.length < n
    ){
      names.push('');
    }


    /*
      Prezzo fisso 25€ per persona.
    */

    const amount =
      n * 25;


    btn.disabled =
      true;


    btn.textContent =
      'Salvataggio…';


    m.textContent =
      '';


    try{

      const j =
        await api(
          'create',
          {
            phone:
              $('ph').value,

            names,

            amount
          }
        );


      /*
        Aggiorniamo la UI senza
        fare subito un nuovo GET.
      */

      L.push({

        code:j.code,

        name:names[0],

        phone:$('ph').value,

        paid:false,

        amount:j.amount,

        cancelled:false,

        att:names.map(
          name => ({
            n:name
          })
        )

      });


      FREE =
        j.free;


      USED =
        CAP - FREE;


      render();


      /*
        Reset del form.
      */

      const label =
        names[0] ||
        'Prenotazione';


      $('nm').value='';

      $('ph').value='';

      $('pe').value=1;

      renderNames();


      /*
        QR immediato.
      */

      showQR({

        code:j.code,

        label,

        n:n

      });


    }catch(e){

      m.textContent =
        e.message;

    }


    btn.disabled =
      false;


    btn.textContent =
      'Crea prenotazione e QR';
  };


/* ============================================================
   AZIONI LISTA
   ============================================================ */

$('items').onclick =
  async e => {

    const t =
      e.target.closest(
        'button'
      );


    if(!t) return;


    const b =
      L.find(
        x =>
          x.code ===
          t.dataset.c
      );


    if(!b) return;


    /*
      QR
    */

    if(
      t.dataset.a === 'qr'
    ){

      showQR({

        code:b.code,

        label:
          b.name ||
          b.phone,

        n:b.att.length

      });

      return;
    }


    /*
      PAGAMENTO
    */

    if(
      t.dataset.a === 'paid'
    ){

      await managePayment(b);

      return;
    }


    /*
      ANNULLA / RIPRISTINA
    */

    if(
      t.dataset.a === 'tog'
    ){

      t.disabled =
        true;


      try{

        const j =
          await api(
            'cancel',
            {
              code:b.code,

              value:
                !b.cancelled
            }
          );


        b.cancelled =
          j.cancelled;


        render();


      }catch(err){

        $('fmsg').textContent =
          err.message;

      }


      t.disabled =
        false;
    }

  };


/* ============================================================
   PAGAMENTO
   ============================================================ */

async function managePayment(b){

  const defaultAmount =
    b.amount > 0
      ? b.amount
      : b.att.length * 25;


  const raw =
    prompt(
      b.paid
        ? 'Importo pagato in euro. Inserisci 0 per segnare NON PAGATO:'
        : 'Importo pagato in euro:',
      String(
        b.paid
          ? defaultAmount
          : defaultAmount
      )
    );


  if(raw === null) return;


  let amount =
    Number(
      String(raw)
        .replace(',','.')
    );


  if(
    !isFinite(amount) ||
    amount < 0
  ){

    alert(
      'Importo non valido.'
    );

    return;
  }


  amount =
    Math.round(
      amount * 100
    ) / 100;


  const paid =
    amount > 0;


  try{

    const j =
      await api(
        'paid',
        {
          code:b.code,

          value:paid,

          amount:amount
        }
      );


    b.paid =
      j.paid;


    b.amount =
      j.amount;


    /*
      Aggiornamento totale locale.
    */

    await refresh();


  }catch(e){

    alert(
      e.message
    );

  }
}


/* ============================================================
   QR
   ============================================================ */

function qrCanvas(b){

  const q =
    qrcode(
      0,
      'M'
    );


  q.addData(
    String(b.code)
  );


  q.make();


  const n =
    q.getModuleCount();


  const m =
    4;


  const cell =
    Math.floor(
      600 /
      (n + 2*m)
    );


  const sz =
    cell *
    (n + 2*m);


  const W =
    720;


  const H =
    sz + 230;


  const oy =
    30;


  const ox =
    (W-sz)/2;


  const c =
    document.createElement(
      'canvas'
    );


  c.width =
    W;


  c.height =
    H;


  const x =
    c.getContext(
      '2d'
    );


  x.fillStyle =
    '#fff';


  x.fillRect(
    0,
    0,
    W,
    H
  );


  x.fillStyle =
    '#000';


  for(
    let r=0;
    r<n;
    r++
  ){

    for(
      let k=0;
      k<n;
      k++
    ){

      if(
        q.isDark(
          r,
          k
        )
      ){

        x.fillRect(
          ox+(m+k)*cell,
          oy+(m+r)*cell,
          cell,
          cell
        );

      }

    }

  }


  x.fillStyle =
    '#1E1B3A';


  x.textAlign =
    'center';


  x.font =
    '700 44px system-ui,sans-serif';


  x.fillText(
    String(
      b.label
    ).slice(
      0,
      26
    ),
    W/2,
    oy+sz+60
  );


  x.font =
    '32px system-ui,sans-serif';


  x.fillText(
    b.n +
      (
        b.n==1
          ? ' persona'
          : ' persone'
      ),
    W/2,
    oy+sz+112
  );


  x.font =
    '700 40px monospace';


  x.fillText(
    b.code,
    W/2,
    oy+sz+164
  );


  return c;
}


function showQR(b){

  cur =
    b;


  $('qimg').src =
    qrCanvas(
      b
    ).toDataURL(
      'image/png'
    );


  $('ov')
    .classList
    .add('on');
}


$('close').onclick =
  () =>
    $('ov')
      .classList
      .remove('on');


$('share').onclick =
  () => {

    qrCanvas(
      cur
    ).toBlob(
      async bl => {

        try{

          const f =
            new File(
              [bl],
              cur.code +
              '.png',
              {
                type:
                  'image/png'
              }
            );


          if(
            navigator.canShare &&
            navigator.canShare({
              files:[f]
            })
          ){

            await navigator.share({

              files:[f],

              text:
                'Ecco il tuo QR per entrare alla festa. Mostralo all\'ingresso.'

            });

          }
          else{

            alert(
              'Su questo telefono tieni premuto sull\'immagine per salvarla o inviarla.'
            );

          }

        }catch(e){}

      }
    );
  };


/* ============================================================
   SCANNER - SOLO ADMIN
   ============================================================ */

let stream =
  null;


let scanning =
  false;


let hold =
  false;


const v =
  $('vid');


const cv =
  document.createElement(
    'canvas'
  );


const cx =
  cv.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


let bd =
  null;


let busy =
  false;


let tk =
  0;


try{

  if(
    'BarcodeDetector'
    in window &&
    BarcodeDetector
      .getSupportedFormats
  ){

    BarcodeDetector
      .getSupportedFormats()
      .then(
        f => {

          if(
            f.includes(
              'qr_code'
            )
          ){

            bd =
              new BarcodeDetector({
                formats:[
                  'qr_code'
                ]
              });

          }

        }
      )
      .catch(
        () => {}
      );

  }

}catch(e){}


/* ============================================================
   START SCANNER
   ============================================================ */

async function startScan(){

  if(scanning)
    return;


  $('cam').textContent =
    'Avvio fotocamera…';


  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:
                'environment'
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    v.srcObject =
      stream;


    await v.play();


    try{

      const tr =
        stream
          .getVideoTracks()[0];


      const cap =
        tr.getCapabilities
          ? tr.getCapabilities()
          : {};


      if(
        cap.focusMode &&
        cap.focusMode.includes(
          'continuous'
        )
      ){

        await tr.applyConstraints({
          advanced:[
            {
              focusMode:
                'continuous'
            }
          ]
        });

      }

    }catch(e){}


    scanning =
      true;


    $('cam').textContent =
      'Fotocamera attiva: tieni il QR fermo davanti, a 15-25 cm, con lo schermo alla massima luminosità.';


    tick(
      ++tk
    );


  }catch(e){

    const n =
      e &&
      e.name;


    $('cam').textContent =
      n === 'NotAllowedError'
        ? 'Fotocamera bloccata: consenti l\'accesso alla fotocamera per questo sito, poi ricarica.'

        : n === 'NotFoundError'
        ? 'Nessuna fotocamera trovata su questo dispositivo.'

        : n === 'NotReadableError'
        ? 'La fotocamera è usata da un\'altra app: chiudila e riprova.'

        : 'Fotocamera non disponibile: apri il link nel browser normale (Chrome o Safari).';

  }

}


function stopScan(){

  scanning =
    false;


  if(stream){

    stream
      .getTracks()
      .forEach(
        t =>
          t.stop()
      );


    stream =
      null;
  }
}


/* ============================================================
   SCANNER LOOP
   ============================================================ */

async function tick(id){

  if(
    !scanning ||
    id !== tk
  )
    return;


  if(
    !hold &&
    !busy &&
    v.readyState >= 2 &&
    v.videoWidth
  ){

    busy =
      true;


    try{

      let data =
        null;


      if(bd){

        const c =
          await bd.detect(
            v
          );


        if(c.length)
          data =
            c[0].rawValue;

      }
      else if(
        window.jsQR
      ){

        const sc =
          Math.min(
            1,
            960 /
            v.videoWidth
          );


        cv.width =
          v.videoWidth * sc;


        cv.height =
          v.videoHeight * sc;


        cx.drawImage(
          v,
          0,
          0,
          cv.width,
          cv.height
        );


        const im =
          cx.getImageData(
            0,
            0,
            cv.width,
            cv.height
          );


        const r =
          jsQR(
            im.data,
            im.width,
            im.height,
            {
              inversionAttempts:
                'dontInvert'
            }
          );


        if(r)
          data =
            r.data;

      }


      if(data){

        hold =
          true;


        handle(
          data
        );
      }


    }catch(e){}


    busy =
      false;
  }


  setTimeout(
    () =>
      requestAnimationFrame(
        () =>
          tick(id)
      ),
    80
  );
}


/* ============================================================
   FOTO QR
   ============================================================ */

$('pic').onchange =
  e => {

    const f =
      e.target.files[0];


    if(!f)
      return;


    const img =
      new Image();


    img.onload =
      () => {

        const sc =
          Math.min(
            1,
            1200 /
            Math.max(
              img.width,
              img.height
            )
          );


        cv.width =
          img.width * sc;


        cv.height =
          img.height * sc;


        cx.drawImage(
          img,
          0,
          0,
          cv.width,
          cv.height
        );


        const im =
          cx.getImageData(
            0,
            0,
            cv.width,
            cv.height
          );


        const r =
          jsQR(
            im.data,
            im.width,
            im.height
          );


        if(
          r &&
          r.data
        ){

          handle(
            r.data
          );

        }
        else{

          show(
            'bad',
            'QR NON LETTO',
            [
              'Riprova con più luce e il QR ben centrato.'
            ]
          );

        }

      };


    img.src =
      URL.createObjectURL(
        f
      );


    e.target.value =
      '';

  };


/* ============================================================
   CODICE MANUALE
   ============================================================ */

$('manGo').onclick =
  () => {

    let c =
      $('man')
        .value
        .trim()
        .replace(/\D/g,'');


    if(
      !c
    )
      return;


    if(
      c.length !== 4
    ){

      show(
        'bad',
        'CODICE NON VALIDO',
        [
          'Il codice deve contenere 4 cifre.'
        ]
      );

      return;
    }


    $('man')
      .value =
      '';


    hold =
      true;


    handle(
      c
    );
  };


/* ============================================================
   ENTER MANUALE

$('man').addEventListener(

    if(
      e.key === 'Enter'
    ){

    }

);


/* ============================================================
   RISULTATI SCANNER
   ============================================================ */

function show(
  kind,
  title,
  lines,
  extra
){

  $('res').innerHTML =
    `
      <div
        class="res ${kind}"
      >

        <h2>
          ${title}
        </h2>

        ${
          lines
            .filter(Boolean)
            .map(
              l =>
                `<p>${l}</p>`
            )
            .join('')
        }

        ${extra || ''}

      </div>
    `;


  try{

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        kind === 'ok'
          ? 80
          : [120,80,120]
      );

    }

  }catch(e){}
}


const release =
  ms =>
    setTimeout(
      () => {
        hold =
          false;
      },
      ms
    );


/* ============================================================
   GESTIONE QR
   ============================================================ */

async function handle(
  raw
){

  show(
    'ok',
    'Verifica in corso…',
    []
  );


  try{

    /*
      Il QR ora contiene direttamente
      il codice a 4 cifre.
    */

    const r =
      await api(
        'scan',
        {
          code:
            String(raw)
              .trim()
              .toUpperCase(),

          auto:1
        }
      );


    const b =
      r.b;


    if(
      r.status === 'invalid'
    ){

      show(
        'bad',
        '❌ NON VALIDO',
        [
          'Questo QR non è nella lista.'
        ]
      );


      release(2500);

      return;
    }


    const nm =
      esc(
        b.name ||
        b.phone
      );


    if(
      r.status === 'cancelled'
    ){

      show(
        'bad',
        '❌ ANNULLATO',
        [
          nm,
          'La prenotazione è stata annullata.'
        ]
      );


      release(2500);

      return;
    }


    if(
      r.status === 'used'
    ){

      show(
        'bad',
        '❌ GIÀ UTILIZZATO',
        [
          nm,

          `Tutte le ${b.att.length} persone sono già entrate.`,

          r.last
            ? 'Ultimo ingresso: ' +
              r.last
            : ''
        ]
      );


      release(2500);

      return;
    }


    if(
      r.status === 'admitted'
    ){

      show(
        'ok',
        '✅ INGRESSO CONSENTITO',
        [
          esc(
            b.name ||
            b.phone
          ),

          'Ingresso: ' +
          r.t
        ]
      );


      release(1500);

      return;
    }


    const pend =
      b.att.filter(
        a => !a.e
      );


    show(
      'ok',
      '✅ QR VALIDO',
      [
        nm,

        `Prenotazione per ${b.att.length} persone · già entrate ${b.att.length-pend.length}`,

        'Spunta chi entra adesso:'
      ],

      `
        <div
          style="
            text-align:left;
            margin:12px 0
          "
        >

          ${
            pend
              .map(
                a =>
                  `
                    <label
                      style="
                        display:flex;
                        gap:12px;
                        align-items:center;
                        margin:0;
                        padding:10px 0;
                        font-size:18px;
                        color:var(--ink)
                      "
                    >

                      <input
                        type="checkbox"
                        class="ck"
                        value="${a.k}"
                        checked
                        style="
                          width:26px;
                          height:26px;
                          padding:0;
                          flex:0 0 auto
                        "
                      >

                      ${esc(
                        a.n ||
                        'Persona ' +
                        a.k
                      )}

                    </label>
                  `
              )
              .join('')
          }

        </div>


        <button
          class="btn full"
          id="go"
        >
          Conferma ingresso
        </button>
      `
    );


    $('go').onclick =
      () => {

        const ix =
          [
            ...document
              .querySelectorAll(
                '.ck:checked'
              )
          ]
          .map(
            c => +c.value
          );


        if(
          !ix.length
        ){

          hold =
            false;


          $('res').innerHTML =
            '';


          return;
        }


        admit(
          b,
          ix
        );

      };


  }catch(e){

    show(
      'bad',
      'ERRORE',
      [
        esc(
          e.message
        )
      ]
    );


    release(2500);
  }
}


/* ============================================================
   ADMIT
   ============================================================ */

async function admit(
  b,
  ix
){

  try{

    const r =
      await api(
        'admit',
        {
          code:b.code,
          idx:ix
        }
      );


    if(
      !r.entered.length
    ){

      show(
        'bad',
        '❌ GIÀ UTILIZZATO',
        [
          esc(
            b.name ||
            b.phone
          ),

          'Già entrato: ' +
          esc(
            r.skipped.join(', ')
          )
        ]
      );

    }
    else{

      show(
        'ok',
        '✅ INGRESSO CONSENTITO',
        [
          esc(
            b.name ||
            b.phone
          ),

          'Entrano: ' +
          esc(
            r.entered.join(', ')
          ),

          `Totale entrati ${r.total} su ${r.of}`,

          'Ingresso: ' +
          r.t
        ]
      );

    }


    release(1500);


  }catch(e){

    show(
      'bad',
      'ERRORE',
      [
        esc(
          e.message
        )
      ]
    );


    release(2500);
  }
}


/* ============================================================
   NAVIGAZIONE
   ============================================================ */

$('nav').onclick =
  e => {

    const t =
      e.target.closest(
        'button'
      );


    if(!t)
      return;


    document
      .querySelectorAll(
        'nav button'
      )
      .forEach(
        x =>
          x.classList.toggle(
            'on',
            x === t
          )
      );


    $('list').hidden =
      t.dataset.tab !==
      'list';


    $('scan').hidden =
      t.dataset.tab !==
      'scan';


    if(
      t.dataset.tab ===
      'scan'
    ){

      hold =
        false;


      startScan();

    }
    else{

      stopScan();

    }

  };


/* ============================================================
   AVVIO
   ============================================================ */

init();

</script>
