<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ingressi festa</title>

<style>

:root{
  --bg:#F6F3FF;
  --card:#fff;
  --ink:#1E1B3A;
  --mut:#6B6890;
  --line:#DDD8F2;

  --acc:#D62D6A;
  --molly:#635BDB;

  --ok:#0F7A55;
  --okbg:#D6F4E6;

  --bad:#B3243A;
  --badbg:#FCDDE2;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
}

main{
  max-width:620px;
  margin:0 auto;
  padding:18px 16px 40px;
}

h1{
  font-size:30px;
  line-height:1.1;
  margin:0 0 6px;
}

.head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:5px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 12px;
  border-radius:999px;
  background:var(--acc);
  color:#fff;
  font-weight:800;
  font-size:13px;
}

.badge.molly{
  background:var(--molly);
}

.stats{
  color:var(--mut);
  font-size:14px;
  margin-bottom:16px;
}

.stats b{
  color:var(--ink);
}

nav{
  display:flex;
  gap:6px;
  margin-bottom:16px;
}

nav button{
  flex:1;
  padding:12px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

nav button.on{
  background:var(--acc);
  color:white;
  border-color:var(--acc);
}

.molly-theme nav button.on,
.molly-theme .primary{
  background:var(--molly);
  border-color:var(--molly);
}

.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}

label{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin:8px 0 4px;
}

input{
  width:100%;
  padding:12px;
  font:inherit;
  background:var(--bg);
  color:var(--ink);
  border:1.5px solid var(--line);
  border-radius:10px;
}

input:focus,
button:focus-visible{
  outline:3px solid var(--acc);
  outline-offset:1px;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.btn{
  padding:12px 16px;
  border:0;
  border-radius:12px;
  background:var(--acc);
  color:white;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}

.btn.g{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--line);
}

.btn.s{
  padding:8px 12px;
  font-size:14px;
}

.btn.full{
  width:100%;
  margin-top:12px;
}

.btn:disabled{
  opacity:.5;
}

.msg{
  min-height:20px;
  margin-top:8px;
  font-size:14px;
}

.payrow{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.payrow button{
  flex:1;
}

.payrow .active{
  background:var(--ok);
  color:white;
  border-color:var(--ok);
}

.amount-wrap{
  margin-top:8px;
}

.hidden{
  display:none!important;
}

.it{
  padding:14px 0;
  border-top:1px solid var(--line);
}

.it:first-child{
  border-top:0;
}

.topline{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.who{
  flex:1;
  min-width:0;
}

.who b{
  display:block;
  font-size:17px;
}

.who span{
  font-size:13px;
  color:var(--mut);
}

.code{
  font:800 22px/1 monospace;
  letter-spacing:3px;
  background:var(--bg);
  padding:8px 12px;
  border-radius:10px;
}

.meta{
  margin-top:7px;
  font-size:14px;
}

.paid{
  color:var(--ok);
  font-weight:800;
}

.unpaid{
  color:var(--bad);
  font-weight:800;
}

.people{
  margin-top:7px;
  color:var(--mut);
  font-size:13px;
}

.acts{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.off{
  opacity:.55;
}

.off .who b{
  text-decoration:line-through;
}

.result{
  border-radius:16px;
  padding:20px;
  margin-top:14px;
  text-align:center;
}

.result.ok{
  background:var(--okbg);
  color:var(--ok);
}

.result.bad{
  background:var(--badbg);
  color:var(--bad);
}

.result h2{
  margin:0 0 8px;
  font-size:27px;
}

.result p{
  margin:5px 0;
  color:var(--ink);
}

.person-check{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  font-size:17px;
}

.person-check input{
  width:24px;
  height:24px;
}

.entry-code{
  font-size:30px;
  letter-spacing:5px;
  text-align:center;
  font-weight:800;
}

.hint{
  font-size:13px;
  color:var(--mut);
  margin:8px 0;
}

.loading{
  opacity:.7;
}

</style>

</head>


<body>

<main id="app">

  <div class="head">
    <span id="badge" class="badge hidden"></span>
  </div>

  <h1>Ingressi festa</h1>

  <div class="stats" id="stats">
    Caricamento…
  </div>

  <div class="msg" id="top"></div>


  <nav id="nav" class="hidden">

    <button data-tab="list" class="on">
      Prenotazioni
    </button>

    <button data-tab="entry">
      Ingresso
    </button>

  </nav>


  <!-- =====================================================
       PRENOTAZIONI
       ===================================================== -->

  <section id="list">

    <div class="box">

      <label for="nm">
        Nome di chi prenota
      </label>

      <input
        id="nm"
        placeholder="Paolo Rossi"
        autocomplete="name"
      >


      <div class="row">

        <div>

          <label for="ph">
            Telefono
          </label>

          <input
            id="ph"
            type="tel"
            inputmode="tel"
            placeholder="333 1234567"
          >

        </div>


        <div>

          <label for="pe">
            Persone
          </label>

          <input
            id="pe"
            type="number"
            min="1"
            max="50"
            value="1"
            inputmode="numeric"
          >

        </div>

      </div>


      <div id="names"></div>


      <!-- PAGAMENTO -->

      <label>
        Pagamento
      </label>

      <div class="payrow">

        <button
          type="button"
          class="btn g active"
          id="paidYes"
        >
          ✓ PAGATO
        </button>

        <button
          type="button"
          class="btn g"
          id="paidNo"
        >
          DA PAGARE
        </button>

      </div>


      <div
        class="amount-wrap"
        id="amountWrap"
      >

        <label for="amount">
          Importo pagato (€)
        </label>

        <input
          id="amount"
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          value="25"
        >

        <div class="hint">
          Prezzo previsto:
          €<span id="expected">25</span>
        </div>

      </div>


      <button
        class="btn full primary"
        id="add"
      >
        Crea prenotazione
      </button>


      <div
        class="msg"
        id="fmsg"
      ></div>

    </div>


    <input
      id="q"
      type="search"
      placeholder="Cerca per nome, telefono o codice"
      class="hidden"
    >


    <div
      class="box"
      id="items"
      style="margin-top:12px"
    ></div>

  </section>


  <!-- =====================================================
       INGRESSO ADMIN
       ===================================================== -->

  <section
    id="entry"
    class="hidden"
  >

    <div class="box">

      <label for="entryCode">
        Codice invitato
      </label>

      <input
        id="entryCode"
        class="entry-code"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        placeholder="4827"
      >


      <button
        class="btn full primary"
        id="checkCode"
      >
        Verifica codice
      </button>


      <div class="hint">
        L'invitato deve comunicare solo
        le 4 cifre del proprio codice.
      </div>


      <div id="res"></div>

    </div>

  </section>

</main>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API =
'https://script.google.com/macros/s/AKfycbxO-R2yW13gYo4jHB-rls7jxcv-GDUsv8jsaFsWVwkTLRmrkc4RRERwDSSPU8HUMLov/exec';


let K = null;
let ME = null;
let L = [];

let FREE = 0;
let USED = 0;
let CAP = 180;
let PRICE = 25;

let entryBusy = false;


/* =========================================================
   UTILITY
   ========================================================= */

const $ =
  id => document.getElementById(id);


const esc =
  s => String(s ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );


const rid =
  () =>
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);


/* =========================================================
   CHIAVE
   ========================================================= */

(function(){

  const p =
    new URLSearchParams(
      location.search
    ).get('k');


  if(p){

    try{
      localStorage.setItem(
        'k',
        p
      );
    }catch(e){}

    history.replaceState(
      null,
      '',
      location.pathname
    );

  }


  try{

    K =
      p ||
      localStorage.getItem('k');

  }catch(e){

    K = p;

  }

})();


/* =========================================================
   API
   =========================================================

   IMPORTANTE:
   ora usiamo GET invece di POST.
   Questo evita il problema del
   "Risposta non valida da Google".
   ========================================================= */

async function api(
  action,
  data = {}
){

  const params =
    new URLSearchParams();


  params.set(
    'key',
    K || ''
  );


  params.set(
    'action',
    action
  );


  params.set(
    'rid',
    rid()
  );


  Object.keys(data).forEach(
    key => {

      const value =
        data[key];


      if(
        value === undefined ||
        value === null
      ){
        return;
      }


      if(
        Array.isArray(value) ||
        typeof value === 'object'
      ){

        params.set(
          key,
          JSON.stringify(value)
        );

      }else{

        params.set(
          key,
          String(value)
        );

      }

    }
  );


  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () => controller.abort(),
      15000
    );


  try{

    const response =
      await fetch(
        API +
        '?' +
        params.toString(),
        {
          method:'GET',
          cache:'no-store',
          signal:controller.signal
        }
      );


    const text =
      await response.text();


    let json;


    try{

      json =
        JSON.parse(text);

    }catch(e){

      console.error(
        'Risposta Google:',
        text
      );

      throw new Error(
        'Google non ha restituito JSON. Controlla il deployment Apps Script.'
      );

    }


    if(!json.ok){

      throw new Error(
        json.error ||
        'Errore Google'
      );

    }


    return json;

  }catch(e){

    if(
      e.name === 'AbortError'
    ){

      throw new Error(
        'Google sta rispondendo troppo lentamente. Riprova.'
      );

    }


    throw e;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   INIT
   ========================================================= */

async function init(){

  if(!K){

    $('stats').textContent = '';

    $('top').textContent =
      'Link non valido.';

    return;
  }


  try{

    /*
     * UNA SOLA richiesta.
     */
    const j =
      await api('init');


    ME = j;

    L =
      j.list || [];


    FREE =
      j.free;


    USED =
      j.used;


    CAP =
      j.capacity;


    PRICE =
      j.ticketPrice || 25;


    $('badge').textContent =
      j.name.toUpperCase();


    $('badge')
      .classList
      .remove('hidden');


    /*
     * Colore Molly
     */
    if(
      j.name.toLowerCase() ===
      'molly'
    ){

      $('badge')
        .classList
        .add('molly');

      $('app')
        .classList
        .add('molly-theme');

    }


    /*
     * Solo admin vede ingresso
     */
    if(
      j.role === 'admin'
    ){

      $('nav')
        .classList
        .remove('hidden');

      $('q')
        .classList
        .remove('hidden');

    }


    updateAmountDefault();

    render();


  }catch(e){

    $('stats').textContent = '';

    $('top').textContent =
      e.message;

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  if(!ME){
    return;
  }


  const admin =
    ME.role === 'admin';


  const q =
    admin
      ? $('q').value
          .trim()
          .toLowerCase()
      : '';


  const entered =
    L
      .filter(
        b => !b.cancelled
      )
      .reduce(
        (total,b) =>
          total +
          b.att.filter(
            a => a.e
          ).length,
        0
      );


  const paidTotal =
    L
      .filter(
        b =>
          !b.cancelled &&
          b.paid
      )
      .reduce(
        (total,b) =>
          total +
          Number(
            b.amount || 0
          ),
        0
      );


  if(admin){

    $('stats').innerHTML =
      `Prenotati <b>${USED}</b> su ${CAP}
       · Entrati <b>${entered}</b>
       · Liberi <b>${FREE}</b>
       · Incassati <b>€${paidTotal.toFixed(2)}</b>`;

  }else{

    $('stats').innerHTML =
      `Posti ancora liberi:
       <b>${FREE}</b>`;

  }


  const R =
    L
      .filter(
        b =>
          !q ||
          (
            b.name +
            ' ' +
            b.phone +
            ' ' +
            b.code +
            ' ' +
            b.att
              .map(a => a.n)
              .join(' ')
          )
          .toLowerCase()
          .includes(q)
      )
      .slice()
      .reverse();


  $('items').innerHTML =
    R.length
      ? R
          .map(
            b => card(b,admin)
          )
          .join('')
      : '<p class="hint" style="margin:0">Nessuna prenotazione.</p>';

}


/* =========================================================
   CARD PRENOTAZIONE
   ========================================================= */

function card(
  b,
  admin
){

  const n =
    b.att.length;


  const people =
    b.att
      .map(
        a =>
          (a.e ? '✓ ' : '') +
          (a.n || 'senza nome')
      )
      .join(', ');


  const payment =
    b.paid
      ? `<span class="paid">
           PAGATO · €${Number(
             b.amount || 0
           ).toFixed(2)}
         </span>`
      : `<span class="unpaid">
           DA PAGARE
         </span>`;


  return `
    <div class="it ${b.cancelled?'off':''}">

      <div class="topline">

        <div class="who">

          <b>
            ${esc(
              b.name ||
              b.phone
            )}
          </b>

          <span>
            ${esc(b.phone)}
            · ${n}
            ${n===1?'persona':'persone'}
          </span>

        </div>


        <div class="code">
          ${esc(b.code)}
        </div>

      </div>


      <div class="meta">
        ${payment}
      </div>


      ${
        n > 1
        ? `
          <div class="people">
            ${esc(people)}
          </div>
        `
        : ''
      }


      ${
        admin
        ? `
          <div class="hint">
            Creato da:
            ${esc(b.by)}
          </div>
        `
        : ''
      }


      <div class="acts">

        <button
          class="btn g s"
          data-a="paid"
          data-c="${esc(b.code)}"
        >
          ${
            b.paid
              ? 'Modifica pagamento'
              : 'Segna pagato'
          }
        </button>


        ${
          admin
          ? `
            <button
              class="btn g s"
              data-a="cancel"
              data-c="${esc(b.code)}"
            >
              ${b.cancelled
                ? 'Ripristina'
                : 'Annulla'}
            </button>

            <button
              class="btn g s"
              data-a="entry"
              data-c="${esc(b.code)}"
            >
              Ingresso
            </button>
          `
          : ''
        }

      </div>

    </div>
  `;

}


/* =========================================================
   RICERCA ADMIN
   ========================================================= */

$('q').oninput =
  render;


/* =========================================================
   PERSONE
   ========================================================= */

function renderNames(){

  const n =
    Math.max(
      1,
      Math.min(
        50,
        parseInt(
          $('pe').value,
          10
        ) || 1
      )
    );


  const old =
    [
      ...document.querySelectorAll(
        '.nx'
      )
    ]
    .map(
      i => i.value
    );


  $('names').innerHTML =
    Array
      .from(
        {length:n-1},
        (_,i) =>
          `
          <label>
            Persona ${i+2}
          </label>

          <input
            class="nx"
            placeholder="Nome"
            value="${esc(
              old[i] || ''
            )}"
          >
          `
      )
      .join('');


  updateAmountDefault();

}


$('pe').oninput =
  renderNames;


/* =========================================================
   IMPORTO
   ========================================================= */

function updateAmountDefault(){

  const n =
    Math.max(
      1,
      Math.min(
        50,
        parseInt(
          $('pe').value,
          10
        ) || 1
      )
    );


  const expected =
    n * PRICE;


  $('expected').textContent =
    expected
      .toFixed(2)
      .replace('.00','');


  if(
    !$('amount').dataset.edited
  ){

    $('amount').value =
      expected.toFixed(2);

  }

}


$('amount').oninput =
  () => {
    $('amount').dataset.edited =
      '1';
  };


$('paidYes').onclick =
  () => setPaidChoice(true);


$('paidNo').onclick =
  () => setPaidChoice(false);


function setPaidChoice(v){

  $('paidYes')
    .classList
    .toggle(
      'active',
      v
    );


  $('paidNo')
    .classList
    .toggle(
      'active',
      !v
    );


  $('amountWrap')
    .classList
    .toggle(
      'hidden',
      !v
    );


  $('amount')
    .disabled =
      !v;


  if(
    v &&
    !$('amount').value
  ){

    updateAmountDefault();

  }

}


/* =========================================================
   CREA PRENOTAZIONE
   ========================================================= */

$('add').onclick =
  async function(){

    const btn =
      $('add');

    const msg =
      $('fmsg');


    const n =
      Math.max(
        1,
        Math.min(
          50,
          parseInt(
            $('pe').value,
            10
          ) || 1
        )
      );


    const names =
      [
        $('nm').value.trim(),
        ...[
          ...document.querySelectorAll(
            '.nx'
          )
        ].map(
          i => i.value.trim()
        )
      ]
      .slice(0,n);


    while(
      names.length < n
    ){

      names.push('');

    }


    const paid =
      $('paidYes')
        .classList
        .contains('active');


    const amount =
      paid
        ? Number(
            $('amount').value || 0
          )
        : 0;


    if(!names[0]){

      msg.textContent =
        'Inserisci il nome della persona 1';

      return;

    }


    if(
      paid &&
      amount <= 0
    ){

      msg.textContent =
        'Inserisci l’importo pagato';

      return;

    }


    btn.disabled = true;

    btn.textContent =
      'Salvataggio…';

    msg.textContent =
      '';


    try{

      const j =
        await api(
          'create',
          {
            phone:$('ph').value,
            names:names,
            paid:paid,
            amount:amount
          }
        );


      $('nm').value = '';

      $('ph').value = '';

      $('pe').value = 1;

      $('amount')
        .dataset
        .edited = '';


      setPaidChoice(true);

      renderNames();


      /*
       * Aggiorna senza bloccare
       * la pagina.
       */
      await refresh();


      msg.style.color =
        'var(--ok)';


      msg.textContent =
        `Prenotazione creata.
         Codice: ${j.code}`;


    }catch(e){

      msg.style.color =
        'var(--bad)';

      msg.textContent =
        e.message;

    }finally{

      btn.disabled = false;

      btn.textContent =
        'Crea prenotazione';

    }

  };


/* =========================================================
   REFRESH
   ========================================================= */

async function refresh(){

  const j =
    await api(
      'list'
    );


  L =
    j.list || [];


  FREE =
    j.free;


  USED =
    j.used;


  render();

}


/* =========================================================
   CLICK PRENOTAZIONI
   ========================================================= */

$('items').onclick =
  async function(e){

    const t =
      e.target.closest(
        'button'
      );


    if(!t){
      return;
    }


    const b =
      L.find(
        x =>
          x.code ===
          t.dataset.c
      );


    if(!b){
      return;
    }


    t.disabled = true;


    try{

      /* PAGAMENTO */

      if(
        t.dataset.a ===
        'paid'
      ){

        const value =
          !b.paid;


        let amount =
          Number(
            b.amount || 0
          );


        if(value){

          const answer =
            prompt(
              'Importo pagato (€):',
              amount > 0
                ? amount.toFixed(2)
                : (
                    b.att.length *
                    PRICE
                  ).toFixed(2)
            );


          if(
            answer === null
          ){

            t.disabled = false;

            return;

          }


          amount =
            Number(
              String(answer)
                .replace(',','.')
            );


          if(
            !isFinite(amount) ||
            amount <= 0
          ){

            throw new Error(
              'Importo non valido'
            );

          }

        }


        await api(
          'paid',
          {
            code:b.code,
            value:value,
            amount:amount
          }
        );

      }


      /* ANNULLA */

      else if(
        t.dataset.a ===
        'cancel'
      ){

        await api(
          'cancel',
          {
            code:b.code,
            value:!b.cancelled
          }
        );

      }


      /* INGRESSO */

      else if(
        t.dataset.a ===
        'entry'
      ){

        if(
          ME.role !==
          'admin'
        ){

          throw new Error(
            'Non autorizzato'
          );

        }


        switchTab(
          'entry'
        );


        $('entryCode').value =
          b.code;


        await verifyCode();


        return;

      }


      await refresh();


    }catch(err){

      $('fmsg').style.color =
        'var(--bad)';

      $('fmsg').textContent =
        err.message;

    }finally{

      t.disabled =
        false;

    }

  };


/* =========================================================
   TAB
   ========================================================= */

function switchTab(tab){

  if(
    ME.role !==
    'admin'
  ){

    return;

  }


  document
    .querySelectorAll(
      'nav button'
    )
    .forEach(
      x =>
        x.classList.toggle(
          'on',
          x.dataset.tab === tab
        )
    );


  $('list')
    .classList
    .toggle(
      'hidden',
      tab !== 'list'
    );


  $('entry')
    .classList
    .toggle(
      'hidden',
      tab !== 'entry'
    );

}


$('nav').onclick =
  e => {

    const t =
      e.target.closest(
        'button'
      );


    if(t){
      switchTab(
        t.dataset.tab
      );
    }

  };


/* =========================================================
   CODICE INGRESSO
   ========================================================= */

$('checkCode').onclick =
  verifyCode;


$('entryCode').onkeydown =
  e => {

    if(
      e.key === 'Enter'
    ){

      verifyCode();

    }

  };


async function verifyCode(){

  if(entryBusy){
    return;
  }


  const code =
    $('entryCode')
      .value
      .trim()
      .toUpperCase();


  if(
    !/^\d{4}$/.test(code)
  ){

    $('res').innerHTML =
      `
      <div class="result bad">

        <h2>
          Codice non valido
        </h2>

        <p>
          Inserisci esattamente
          4 cifre.
        </p>

      </div>
      `;

    return;

  }


  entryBusy = true;

  $('checkCode').disabled =
    true;

  $('checkCode').textContent =
    'Verifica…';


  try{

    const r =
      await api(
        'scan',
        {
          code:code
        }
      );


    if(
      r.status ===
      'invalid'
    ){

      showResult(
        'bad',
        '❌ CODICE NON VALIDO',
        [
          'Il codice non è presente nella lista.'
        ]
      );

      return;

    }


    const b =
      r.b;


    if(
      r.status ===
      'cancelled'
    ){

      showResult(
        'bad',
        '❌ ANNULLATO',
        [
          b.name,
          'La prenotazione è stata annullata.'
        ]
      );

      return;

    }


    if(
      r.status ===
      'used'
    ){

      showResult(
        'bad',
        '❌ GIÀ UTILIZZATO',
        [
          b.name,
          `Tutte le ${b.att.length}
           persone sono già entrate.`
        ]
      );

      return;

    }


    const pending =
      b.att.filter(
        a => !a.e
      );


    showResult(
      'ok',
      'CODICE VALIDO',
      [
        b.name,
        `${b.att.length}
         ${b.att.length===1
           ? 'persona'
           : 'persone'}`,
        `Pagamento:
         ${
           b.paid
             ? 'PAGATO · €' +
               Number(
                 b.amount || 0
               ).toFixed(2)
             : 'DA PAGARE'
         }`
      ],
      `
      <div style="text-align:left;margin-top:12px">

        ${
          pending
            .map(
              a =>
                `
                <label
                  class="person-check"
                >

                  <input
                    type="checkbox"
                    class="ck"
                    value="${a.k}"
                    checked
                  >

                  ${esc(
                    a.n ||
                    'Persona ' + a.k
                  )}

                </label>
                `
            )
            .join('')
        }

      </div>


      <button
        class="btn full primary"
        id="go"
      >
        Conferma ingresso
      </button>
      `
    );


    $('go').onclick =
      async function(){

        const ix =
          [
            ...document
              .querySelectorAll(
                '.ck:checked'
              )
          ]
          .map(
            x =>
              Number(x.value)
          );


        if(
          !ix.length
        ){

          return;

        }


        $('go').disabled =
          true;

        $('go').textContent =
          'Registrazione…';


        try{

          const rr =
            await api(
              'admit',
              {
                code:b.code,
                idx:ix
              }
            );


          if(
            rr.entered.length
          ){

            showResult(
              'ok',
              '✅ INGRESSO CONSENTITO',
              [
                `Entrano:
                 ${rr.entered.join(', ')}`,
                `Totale entrati
                 ${rr.total} su ${rr.of}`,
                'Ora: ' + rr.t
              ]
            );

          }else{

            showResult(
              'bad',
              '❌ GIÀ UTILIZZATI',
              [
                'Le persone selezionate risultano già entrate.'
              ]
            );

          }


          await refresh();


        }catch(e){

          showResult(
            'bad',
            'ERRORE',
            [
              e.message
            ]
          );

        }

      };


  }catch(e){

    showResult(
      'bad',
      'ERRORE',
      [
        e.message
      ]
    );

  }finally{

    entryBusy = false;

    $('checkCode').disabled =
      false;

    $('checkCode').textContent =
      'Verifica codice';

  }

}


/* =========================================================
   RISULTATO
   ========================================================= */

function showResult(
  kind,
  title,
  lines,
  extra = ''
){

  $('res').innerHTML =
    `
    <div
      class="result ${kind}"
    >

      <h2>
        ${title}
      </h2>

      ${
        lines
          .filter(Boolean)
          .map(
            x =>
              `<p>${esc(x)}</p>`
          )
          .join('')
      }

      ${extra}

    </div>
    `;

}


/* =========================================================
   AVVIO
   ========================================================= */

init();

</script>

</html>
