<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingressi festa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3FF;--card:#fff;--ink:#1E1B3A;--mut:#6B6890;--line:#DDD8F2;--acc:#D62D6A;--onacc:#fff;--ok:#0F7A55;--okbg:#D6F4E6;--bad:#B3243A;--badbg:#FCDDE2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132B;--card:#211E42;--ink:#F2EFFF;--mut:#A9A5CF;--line:#38346A;--ok:#5EE0A8;--okbg:#0F3A2B;--bad:#FF8A9B;--badbg:#4A1622}}
:root[data-theme="dark"]{--bg:#15132B;--card:#211E42;--ink:#F2EFFF;--mut:#A9A5CF;--line:#38346A;--ok:#5EE0A8;--okbg:#0F3A2B;--bad:#FF8A9B;--badbg:#4A1622}
/* colore di ogni utente */
body.admin{--acc:#D62D6A;--onacc:#fff}
body.molly{--acc:#0F6BEB;--onacc:#fff}
body.anuraj{--acc:#7C3AED;--onacc:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font:800 30px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px}
.userBadge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:800;letter-spacing:.04em;margin-bottom:10px}
.stats{color:var(--mut);font-size:14px;margin-bottom:16px}.stats b{color:var(--ink)}
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 15px system-ui}
nav button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:12px;font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;text-align:center;text-decoration:none;padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font:700 16px system-ui;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.s{padding:8px 12px;font-size:14px}.btn.full{width:100%;margin-top:10px}
.btn:disabled{opacity:.5}
.msg{min-height:20px;margin-top:8px;font-size:14px;color:var(--bad)}
.sync{font-size:13px;color:var(--mut)}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.who{flex:1 1 60%;min-width:0}.who b{display:block}.who span{font-size:13px;color:var(--mut)}.who strong{color:var(--ink)}
.pp{font:800 18px "Bricolage Grotesque",system-ui,sans-serif;min-width:44px;text-align:right}
.acts{display:flex;gap:6px;width:100%}
.it.off{opacity:.5}.it.off .who b{text-decoration:line-through}
.done,.money{color:var(--ok)}.money{font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.totalBox{margin-bottom:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.totalBox strong{font-size:22px}
.bar{align-items:center;margin-top:4px}
.big{font:800 44px "Bricolage Grotesque",system-ui,sans-serif;text-align:center;letter-spacing:.25em;padding:16px}
.res{border-radius:16px;padding:20px;margin-top:14px;text-align:center}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.res h2{margin:0 0 8px;font:800 28px/1.1 "Bricolage Grotesque",system-ui,sans-serif}.res p{margin:4px 0;color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.pop{background:var(--card);border-radius:18px;padding:16px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center}
.bigcode{font:800 72px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.12em;margin:6px 0 4px;color:var(--acc)}
.hint{font-size:13px;color:var(--mut);margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <div class="userBadge" id="userBadge" hidden></div>
 <h1>Ingressi festa</h1>
 <div class="stats" id="stats">Caricamento…</div>
 <div class="msg" id="top"></div>
 <div class="sync" id="sync"></div>

 <nav id="nav" hidden><button data-tab="list" class="on">Prenotazioni</button><button data-tab="scan">Ingresso</button></nav>

 <section id="list" hidden>
  <div class="box">
   <label for="co">C/O (chi prenota)</label>
   <input id="co" placeholder="Irene" autocomplete="off">
   <div class="row">
    <div><label for="ph">Telefono</label><input id="ph" type="tel" inputmode="tel" placeholder="333 1234567" autocomplete="off"></div>
    <div><label for="pe">Persone</label><input id="pe" type="number" min="1" max="50" value="1" inputmode="numeric"></div>
   </div>
   <div id="names"></div>
   <button class="btn full" id="add">Crea prenotazione e codice</button>
   <div class="msg" id="fmsg"></div>
  </div>

  <div class="totalBox" id="totalBox" hidden><div>Totale incassato</div><strong id="totalCollected">€ 0,00</strong></div>

  <div class="row bar">
   <input id="q" type="search" placeholder="Cerca per C/O, nome, telefono o codice" hidden>
   <button class="btn g s" id="rf" style="flex:0 0 auto">↻ Aggiorna</button>
  </div>
  <div class="hint" id="upd"></div>
  <div class="box" id="items" style="margin-top:8px"></div>
 </section>

 <section id="scan" hidden>
  <label for="man">Codice di 4 cifre</label>
  <input id="man" class="big" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
  <p class="hint">Scrivi il codice che ti mostra l'invitato: il risultato compare appena inserisci la quarta cifra.</p>
  <div id="res"></div>
 </section>
</main>

<div class="ov" id="ov"><div class="pop">
 <div class="hint">Codice di ingresso</div>
 <div class="bigcode" id="bigcode"></div>
 <p class="hint" id="sub"></p>
 <a class="btn full" id="wa" target="_blank" rel="noopener">Invia su WhatsApp</a>
 <button class="btn g full" id="cp">Copia messaggio</button>
 <button class="btn g s full" id="close">Chiudi</button>
</div></div>

<div class="ov" id="ovp"><div class="pop">
 <b>Inserisci il PIN</b>
 <label for="pin" style="text-align:left">PIN personale (lo scrivi una sola volta su questo telefono)</label>
 <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
 <div class="msg" id="pinm"></div>
 <button class="btn full" id="pinOk">Entra</button>
</div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxO-R2yW13gYo4jHB-rls7jxcv-GDUsv8jsaFsWVwkTLRmrkc4RRERwDSSPU8HUMLov/exec';
const USERS_OK=['admin','molly','anuraj'];
const COLORS={admin:'#D62D6A',molly:'#0F6BEB',anuraj:'#7C3AED'};
let U=null,ME=null,L=[],FREE=0,USED=0,CAP=180,PRICE=25,PEND=[],cur=null,gen=0,opBusy=0,poll=null,PIN_MEM='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n||0));
const bump=()=>{gen++};
const hhmmss=()=>new Date().toLocaleTimeString('it-IT');

/* chi sei: dall'indirizzo (…/?u=admin, …/?u=molly, …/?u=anuraj oppure …/#molly) */
(function(){
 const m=location.pathname.toLowerCase().match(/(?:^|\/)(admin|molly|anuraj)(?:\/|$)/);
 const h=String(location.hash||'').replace(/^#\/?/,'');
 const u=m?m[1]:String(new URLSearchParams(location.search).get('u')||h).toLowerCase();
 U=USERS_OK.indexOf(u)>=0?u:null;
})();
const getPin=()=>{try{return localStorage.getItem('pin_'+U)||PIN_MEM}catch(e){return PIN_MEM}};

async function api(action,d){
 const body=JSON.stringify(Object.assign({user:U,pin:getPin(),action,rid:Date.now().toString(36)+Math.random().toString(36).slice(2,8)},d||{}));
 let last='';
 for(let i=0;i<4;i++){
  let r,t,j;const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
  try{r=await fetch(API,{method:'POST',body,signal:ctl.signal});t=await r.text()}
  catch(e){clearTimeout(to);last=e.name==='AbortError'?'Google non risponde':'Nessuna connessione a Google';await sleep(600*(i+1));continue}
  clearTimeout(to);
  try{j=JSON.parse(t)}catch(e){last='Google non ha risposto correttamente (codice '+r.status+')';await sleep(600*(i+1));continue}
  if(j.busy){last=j.error;await sleep(800*(i+1));continue}
  if(!j.ok){const e=new Error(j.error||'Errore');e.pin=!!j.pin;throw e}
  return j;
 }
 const e=new Error(last+'. Riprova tra qualche secondo.');e.net=true;throw e;
}

/* ---------- avvio e aggiornamento ---------- */
function applyData(j){L=j.list;FREE=j.free;USED=j.used;CAP=j.capacity;PRICE=j.price||PRICE;$('upd').textContent='Aggiornato alle '+hhmmss();render()}
async function refresh(){
 if(PEND.length||opBusy>0)return;
 const g0=gen,j=await api('init');
 if(g0!==gen||PEND.length||opBusy>0)return;   // nel frattempo hai fatto una modifica: non sovrascrivere
 applyData(j);
}
function start(j){
 ME=j;$('ovp').classList.remove('on');
 document.body.classList.add(U);
 $('userBadge').textContent=j.role==='admin'?'ADMIN':j.name.toUpperCase();$('userBadge').hidden=false;
 $('list').hidden=false;
 if(j.role==='admin'){$('nav').hidden=false;$('q').hidden=false;$('totalBox').hidden=false}
 applyData(j);
 if(!poll)poll=setInterval(()=>{if(document.visibilityState==='visible')refresh().catch(()=>{})},20000);
}
async function init(){
 if(!U){$('stats').textContent='';$('top').textContent='Link non valido. Usa il tuo link personale (…/?u=admin, …/?u=molly oppure …/?u=anuraj).';return}
 try{start(await api('init'))}
 catch(e){
  if(e.pin){const had=!!getPin();try{localStorage.removeItem('pin_'+U)}catch(x){}PIN_MEM='';$('pinm').textContent=had?'PIN errato, riprova.':'';$('pin').value='';$('ovp').classList.add('on');return}
  $('stats').textContent='';$('top').textContent=e.message;
 }
}
$('pinOk').onclick=()=>{const p=$('pin').value.trim();if(!p)return;PIN_MEM=p;try{localStorage.setItem('pin_'+U,p)}catch(e){}init()};
$('rf').onclick=async()=>{const b=$('rf');b.disabled=true;b.textContent='…';try{await refresh();$('fmsg').textContent=''}catch(e){$('fmsg').textContent=e.message}b.disabled=false;b.textContent='↻ Aggiorna'};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ME)refresh().catch(()=>{})});

/* ---------- lista ---------- */
function render(){
 if(!ME)return;
 const admin=ME.role==='admin',q=admin?$('q').value.trim().toLowerCase():'';
 if(admin){USED=L.filter(b=>!b.cancelled).reduce((t,b)=>t+b.att.length,0);FREE=CAP-USED}
 const act=L.filter(b=>!b.cancelled),ent=act.reduce((t,b)=>t+b.att.filter(a=>a.e).length,0);
 $('stats').innerHTML=admin?`Prenotati <b>${USED}</b> su ${CAP} · Entrati <b>${ent}</b> · Liberi <b>${FREE}</b>`:`Posti ancora liberi: <b>${FREE}</b>`;
 if(admin)$('totalCollected').textContent=money(act.reduce((t,b)=>t+(b.paid?b.amount||0:0),0));
 const R=L.filter(b=>!q||(b.co+' '+b.phone+' '+b.code+' '+b.att.map(a=>a.n).join(' ')).toLowerCase().includes(q)).slice().reverse();
 $('items').innerHTML=R.length?R.map(b=>{
  const n=b.att.length,e=b.att.filter(a=>a.e).length;
  const adm=admin?` · <i class="dot" style="background:${esc(COLORS[String(b.by).toLowerCase()]||'#888')}"></i>${esc(b.by)} · ${b.paid?`<span class="money">pagato ${money(b.amount)}</span>`:'da pagare'}`:'';
  return `<div class="it ${b.cancelled?'off':''}"><div class="who"><b>C/O ${esc(b.co)}</b><span>${esc(b.phone)} · ${n} ${n==1?'persona':'persone'} · Codice <strong>${esc(b.code)}</strong>${adm}<br>${esc(b.att.map(a=>(a.e?'✓ ':'')+(a.n||'senza nome')).join(', '))}</span></div>${admin?`<div class="pp ${e>=n&&!b.cancelled?'done':''}">${e}/${n}</div>`:''}<div class="acts"><button class="btn s" data-a="code" data-c="${esc(b.code)}" ${b.cancelled?'hidden':''}>Invia codice</button>${admin?`<button class="btn g s" data-a="paid" data-c="${esc(b.code)}">${b.paid?'Modifica pagamento':'Segna pagato'}</button><button class="btn g s" data-a="tog" data-c="${esc(b.code)}">${b.cancelled?'Ripristina':'Annulla'}</button>`:''}</div></div>`;
 }).join(''):'<p class="hint" style="margin:0">Nessuna prenotazione.</p>';
}
$('q').oninput=render;

const clampN=()=>Math.max(1,Math.min(50,parseInt($('pe').value,10)||1));
function renderNames(){
 const n=clampN(),old=[...document.querySelectorAll('.nx')].map(i=>i.value);
 $('names').innerHTML=Array.from({length:n},(_,i)=>`<label>Partecipante ${i+1}</label><input class="nx" placeholder="Nome e cognome" value="${esc(old[i]||'')}" autocomplete="off">`).join('');
}
$('pe').oninput=renderNames;renderNames();

$('add').onclick=async()=>{
 const m=$('fmsg'),btn=$('add'),co=$('co').value.trim(),n=clampN();
 const names=[...document.querySelectorAll('.nx')].map(i=>i.value.trim()).slice(0,n);while(names.length<n)names.push('');
 if(!co){m.textContent='Scrivi il nome C/O.';return}
 btn.disabled=true;btn.textContent='Salvataggio…';m.textContent='';opBusy++;
 try{
  const j=await api('create',{co,phone:$('ph').value,names});
  L.push(j.b);FREE=j.free;bump();
  $('co').value='';$('ph').value='';$('pe').value=1;renderNames();render();showCode(j.b);
 }catch(e){m.textContent=e.message}
 opBusy--;btn.disabled=false;btn.textContent='Crea prenotazione e codice';
};

$('items').onclick=async e=>{
 const t=e.target.closest('button');if(!t)return;
 const b=L.find(x=>x.code===t.dataset.c);if(!b)return;
 const a=t.dataset.a;
 if(a==='code'){showCode(b);return}
 if(a==='paid'){managePayment(b);return}
 if(a==='tog'){
  const old=b.cancelled;b.cancelled=!old;bump();render();opBusy++;   // si aggiorna subito, poi si salva
  try{await api('cancel',{code:b.code,value:!old})}
  catch(err){b.cancelled=old;bump();render();alert('Non salvato: '+err.message)}
  opBusy--;
 }
};

async function managePayment(b){
 const def=b.paid&&b.amount>0?b.amount:b.att.length*PRICE;
 const raw=prompt(b.paid?'Importo pagato in euro (0 = segna NON pagato):':'Importo pagato in euro:',String(def));
 if(raw===null)return;
 let a=Number(String(raw).replace(',','.'));
 if(!isFinite(a)||a<0){alert('Importo non valido.');return}
 a=Math.round(a*100)/100;
 const old={paid:b.paid,amount:b.amount};
 b.paid=a>0;b.amount=a>0?a:0;bump();render();opBusy++;
 try{await api('paid',{code:b.code,value:a>0,amount:a})}
 catch(e){b.paid=old.paid;b.amount=old.amount;bump();render();alert('Pagamento non salvato: '+e.message)}
 opBusy--;
}

/* ---------- codice da mandare all'invitato ---------- */
function waNum(p){const raw=String(p||'').trim(),d=raw.replace(/\D/g,'');if(raw.startsWith('+'))return d;if(d.startsWith('00'))return d.slice(2);if(d.length<=10&&d.startsWith('3'))return '39'+d;return d}
function showCode(b){
 cur=b;const n=b.att.length;
 const msg=`Ciao ${b.co}! Ecco il tuo CODICE per entrare alla festa: ${b.code}\nMostralo all'ingresso. Valido per ${n} ${n==1?'persona':'persone'}.`;
 cur.msg=msg;
 $('bigcode').textContent=b.code;$('sub').textContent='C/O '+b.co+' · '+n+(n==1?' persona':' persone');
 $('wa').href='https://wa.me/'+waNum(b.phone)+'?text='+encodeURIComponent(msg);
 $('cp').textContent='Copia messaggio';$('ov').classList.add('on');
}
$('close').onclick=()=>$('ov').classList.remove('on');
$('cp').onclick=async()=>{
 try{await navigator.clipboard.writeText(cur.msg);$('cp').textContent='Copiato ✓'}
 catch(e){const t=document.createElement('textarea');t.value=cur.msg;document.body.appendChild(t);t.select();try{document.execCommand('copy');$('cp').textContent='Copiato ✓'}catch(x){$('cp').textContent='Copia non riuscita'}t.remove()}
};

/* ---------- ingresso: si scrive il codice a 4 cifre ---------- */
function show(kind,title,lines,extra){
 $('res').innerHTML=`<div class="res ${kind}"><h2>${title}</h2>${lines.filter(Boolean).map(l=>`<p>${l}</p>`).join('')}${extra||''}</div>`;
 try{navigator.vibrate&&navigator.vibrate(kind==='ok'?80:[120,80,120])}catch(e){}
}
$('man').oninput=()=>{const v=$('man').value.replace(/\D/g,'').slice(0,4);$('man').value=v;if(v.length===4){$('man').value='';handle(v)}};
$('man').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=$('man').value;if(v&&v.length!==4){show('bad','CODICE NON VALIDO',['Il codice ha 4 cifre.'])}}});
const focusMan=()=>{try{$('man').focus()}catch(e){}};

/* Il telefono controlla la lista che ha già in memoria (risposta immediata) e salva l'ingresso sul Foglio in background */
async function handle(code){
 const b=L.find(x=>x.code===code);
 if(b){
  const nm='C/O '+esc(b.co);
  if(b.cancelled){show('bad','❌ ANNULLATO',[nm,'La prenotazione è stata annullata.']);focusMan();return}
  if(b.att.every(a=>a.e)){const last=b.att.map(a=>a.t).filter(Boolean).pop()||'';show('bad','❌ GIÀ UTILIZZATO',[nm,`Tutte le ${b.att.length} persone sono già entrate.`,last?'Ultimo ingresso: '+last:'']);focusMan();return}
  if(b.att.length===1)admitLocal(b,[b.att[0].k]);else groupUI(b);
  return;
 }
 show('ok','Verifica in corso…',[]);
 try{
  const r=await api('scan',{code});
  if(r.status==='invalid'){show('bad','❌ NON VALIDO',['Questo codice non è nella lista.']);focusMan();return}
  if(!L.some(x=>x.code===r.b.code))L.push(r.b);
  render();handle(code);
 }catch(e){show('bad','ERRORE',[esc(e.message)]);focusMan()}
}
function groupUI(b){
 const pend=b.att.filter(a=>!a.e),done=b.att.length-pend.length;
 show('ok','✅ CODICE VALIDO',['C/O '+esc(b.co),`Prenotazione per ${b.att.length} persone · già entrate ${done}`,'Spunta chi entra adesso:'],
  `<div style="text-align:left;margin:12px 0">${pend.map(a=>`<label style="display:flex;gap:12px;align-items:center;margin:0;padding:10px 0;font-size:18px;color:var(--ink)"><input type="checkbox" class="ck" value="${a.k}" checked style="width:26px;height:26px;padding:0;flex:0 0 auto"> ${esc(a.n||'Persona '+a.k)}</label>`).join('')}</div><button class="btn full" id="go">Conferma ingresso</button>`);
 $('go').onclick=()=>{const ix=[...document.querySelectorAll('.ck:checked')].map(c=>+c.value);if(!ix.length){$('res').innerHTML='';focusMan();return}admitLocal(b,ix)};
}
function admitLocal(b,ix){
 b=L.find(x=>x.code===b.code)||b;
 const t=new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','');
 const nm=k=>{const a=b.att.find(x=>x.k===k);return esc(a&&a.n||'Persona '+k)};
 ix.forEach(k=>{const a=b.att.find(x=>x.k===k);if(a){a.e=true;a.t=t}});bump();
 show('ok','✅ INGRESSO CONSENTITO',['C/O '+esc(b.co),'Entrano: '+ix.map(nm).join(', '),`Totale entrati ${b.att.filter(a=>a.e).length} su ${b.att.length}`,'Ingresso: '+t]);
 render();PEND.push({code:b.code,idx:ix,name:'C/O '+b.co});syncBanner();flush();focusMan();
}
function syncBanner(){$('sync').textContent=PEND.length?'Salvataggio sul Foglio in corso: '+PEND.length+' ingressi in attesa…':''}
let flushing=false;
async function flush(){
 if(flushing)return;flushing=true;
 while(PEND.length){
  const p=PEND[0];
  try{
   const r=await api('admit',{code:p.code,idx:p.idx});PEND.shift();
   if(!r.entered.length)alert('Attenzione: '+p.name+' risultava già entrato da un altro dispositivo.');
  }catch(e){
   if(e.net){syncBanner();await sleep(4000);continue}
   PEND.shift();alert('Ingresso di '+p.name+' non salvato sul Foglio: '+e.message);
  }
  syncBanner();
 }
 flushing=false;
}

/* ---------- schede ---------- */
$('nav').onclick=e=>{
 const t=e.target.closest('button');if(!t)return;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===t));
 $('list').hidden=t.dataset.tab!=='list';$('scan').hidden=t.dataset.tab!=='scan';
 if(t.dataset.tab==='scan')focusMan();
 refresh().catch(()=>{});
};
init();
</script>
