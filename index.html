<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ingressi festa</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f6f3ff;
  color: #17152e;
}

body.admin {
  background: #ffffff;
  color: #111111;
}

.container {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 24px 16px 60px;
}

body.admin .container {
  max-width: 900px;
}

.badge {
  display: inline-block;
  padding: 7px 14px;
  border-radius: 999px;

  background: #7c3aed;
  color: white;

  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
}

body.admin .badge {
  background: #111111;
  color: #ffffff;
}

h1 {
  margin: 12px 0 4px;

  font-size: 34px;
  line-height: 1.05;
}

.subtitle {
  color: #69658a;
  margin-bottom: 28px;
}

body.admin .subtitle {
  color: #555555;
}

.card {
  background: white;

  border: 1px solid #ded8f4;
  border-radius: 18px;

  padding: 20px;

  margin-bottom: 18px;

  box-shadow:
    0 4px 20px rgba(70, 50, 130, .04);
}

body.admin .card {
  border-color: #dddddd;
  box-shadow: none;
}

label {
  display: block;

  margin-bottom: 7px;

  font-size: 14px;
  color: #69658a;
}

body.admin label {
  color: #555555;
}

input,
select {
  width: 100%;

  border: 1px solid #ddd7f5;
  border-radius: 12px;

  padding: 13px;

  font-size: 16px;

  background: #f8f6ff;
  color: #17152e;

  outline: none;
}

body.admin input,
body.admin select {
  border-color: #cccccc;
  background: #ffffff;
  color: #111111;
}

input:focus {
  border-color: #7c3aed;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.participants {
  margin-top: 14px;
}

.participant {
  margin-bottom: 10px;
}

button {
  border: 0;
  border-radius: 12px;

  padding: 13px 18px;

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.primary {
  width: 100%;

  background: #7c3aed;
  color: white;

  margin-top: 16px;
}

body.admin .primary {
  background: #111111;
  color: white;
}

.secondary {
  background: white;
  border: 1px solid #ddd7f5;
  color: #27223f;
}

body.admin .secondary {
  border-color: #cccccc;
  color: #111111;
}

.payment-title {
  margin-top: 16px;
  margin-bottom: 8px;

  font-size: 14px;
  color: #69658a;
}

.payment-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.pay-btn {
  background: white;
  border: 1px solid #ddd7f5;
  color: #27223f;
}

.pay-btn.active-paid {
  background: #11875d;
  border-color: #11875d;
  color: white;
}

.pay-btn.active-unpaid {
  background: #c6283d;
  border-color: #c6283d;
  color: white;
}

.amount-box {
  margin-top: 10px;
}

.message {
  margin-top: 12px;

  font-size: 14px;
  font-weight: 600;
}

.success {
  color: #11875d;
}

.error {
  color: #c6283d;
}

.list-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 12px;
}

.booking {
  padding: 18px 0;

  border-bottom: 1px solid #e5e0f3;
}

body.admin .booking {
  border-bottom-color: #dddddd;
}

.booking:last-child {
  border-bottom: 0;
}

.booking-top {
  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  gap: 12px;
}

.booking-name {
  font-size: 18px;
  font-weight: 850;
}

.booking-meta {
  margin-top: 5px;

  color: #69658a;
  font-size: 14px;
}

body.admin .booking-meta {
  color: #555555;
}

.code {
  flex-shrink: 0;

  background: #f1edff;

  padding: 8px 13px;

  border-radius: 12px;

  font-size: 23px;
  font-weight: 900;

  letter-spacing: 4px;
}

body.admin .code {
  background: #111111;
  color: white;
}

.people {
  margin-top: 10px;

  font-size: 14px;
}

.person {
  padding: 4px 0;
}

.payment-status {
  margin-top: 10px;

  font-weight: 900;
}

.paid {
  color: #11875d;
}

.unpaid {
  color: #c6283d;
}

.booking-actions {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 12px;
}

.invite {
  background: #7c3aed;
  color: white;
}

body.admin .invite {
  background: #111111;
}

.search-box {
  margin-bottom: 14px;
}

.search-box input {
  font-size: 17px;
}

.admin-tools {
  display: grid;

  grid-template-columns: 1fr;

  gap: 12px;

  margin-bottom: 18px;
}

.admit-box {
  display: grid;

  grid-template-columns: 1fr auto;

  gap: 8px;
}

.loading {
  text-align: center;

  padding: 50px 10px;

  color: #69658a;
}

body.admin .loading {
  color: #555;
}

.empty {
  padding: 25px 0;

  text-align: center;

  color: #777;
}

@media (max-width: 600px) {

  .row {
    grid-template-columns: 1fr;
  }

  .booking-top {
    flex-direction: column;
  }

  .code {
    align-self: flex-start;
  }

  .admit-box {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>

<div class="container">

  <div id="app">

    <div class="loading">
      Caricamento...
    </div>

  </div>

</div>


<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API_URL =
  'INCOLLA_QUI_IL_TUO_URL_APPS_SCRIPT_EXEC';


/* ============================================================
   STATO
   ============================================================ */

const state = {

  user: null,

  role: null,

  name: '',

  price: 25,

  free: 0,

  used: 0,

  list: [],

  paymentPaid: false,

  loading: false
};


/* ============================================================
   IDENTIFICA UTENTE DAL LINK
   ============================================================ */

function getUser() {

  const hash =
    location.hash
      .replace('#', '')
      .trim()
      .toLowerCase();


  if (
    hash === 'admin' ||
    hash === 'molly' ||
    hash === 'anuraj'
  ) {
    return hash;
  }


  /*
   * Se non c'è hash,
   * mostra una pagina semplice.
   */

  return null;
}


/* ============================================================
   REQUEST
   ============================================================ */

async function api(action, data = {}) {

  const body = {

    action,

    user: state.user,

    rid:
      Date.now().toString() +
      Math.random().toString(16).slice(2),

    ...data
  };


  const response = await fetch(
    API_URL,
    {
      method: 'POST',

      headers: {
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body: JSON.stringify(body)
    }
  );


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  } catch (e) {

    throw new Error(
      'Risposta non valida da Google.'
    );
  }


  if (!result.ok) {

    throw new Error(
      result.error ||
      'Errore'
    );
  }


  return result;
}


/* ============================================================
   INIT
   ============================================================ */

async function init() {

  state.user =
    getUser();


  if (!state.user) {

    renderLogin();

    return;
  }


  document.body.classList.toggle(
    'admin',
    state.user === 'admin'
  );


  try {

    /*
     * UNA SOLA CHIAMATA AL SERVER
     * ALL'APERTURA.
     */

    const data =
      await api('init');


    state.role =
      data.role;

    state.name =
      data.name;

    state.price =
      Number(data.price || 25);

    state.free =
      Number(data.free || 0);

    state.used =
      Number(data.used || 0);

    state.list =
      data.list || [];


    render();

  } catch (err) {

    showFatalError(
      err.message
    );
  }
}


/* ============================================================
   PAGINA ACCESSO
   ============================================================ */

function renderLogin() {

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="card">

      <h1>Ingressi festa</h1>

      <p>
        Link non valido.
      </p>

      <p>
        Usa uno dei link:
      </p>

      <p>
        <b>#admin</b><br>
        <b>#molly</b><br>
        <b>#anuraj</b>
      </p>

    </div>
  `;
}


/* ============================================================
   ERRORE
   ============================================================ */

function showFatalError(message) {

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="card">

      <h1>Ingressi festa</h1>

      <div class="message error">
        ${escapeHtml(message)}
      </div>

      <br>

      <button
        class="secondary"
        onclick="location.reload()"
      >
        Riprova
      </button>

    </div>
  `;
}


/* ============================================================
   RENDER PRINCIPALE
   ============================================================ */

function render() {

  const admin =
    state.role === 'admin';


  document.getElementById(
    'app'
  ).innerHTML = `

    <span class="badge">
      ${escapeHtml(state.name)}
    </span>

    <h1>Ingressi festa</h1>

    <div class="subtitle">

      Posti ancora liberi:
      <b>${state.free}</b>

    </div>


    ${
      admin
        ? renderAdminTools()
        : ''
    }


    ${renderCreateForm()}


    <div class="card">

      <div class="list-header">

        <b>
          Prenotazioni
        </b>

        <button
          class="secondary"
          onclick="refresh()"
        >
          ↻ Aggiorna
        </button>

      </div>


      ${
        admin
          ? `
            <div class="search-box">

              <input
                id="search"
                placeholder="Cerca C/O, nome o codice..."
                oninput="filterBookings()"
              >

            </div>
          `
          : ''
      }


      <div id="bookingList">

        ${renderBookings(state.list)}

      </div>

    </div>

  `;
}


/* ============================================================
   FORM CREAZIONE
   ============================================================ */

function renderCreateForm() {

  return `

    <div class="card">

      <label>
        C/O (chi prenota)
      </label>

      <input
        id="co"
        placeholder="Paolo Rossi"
      >


      <div class="row">

        <div>

          <label>
            Telefono
          </label>

          <input
            id="phone"
            placeholder="333 1234567"
            inputmode="tel"
          >

        </div>


        <div>

          <label>
            Persone
          </label>

          <input
            id="peopleCount"
            type="number"
            min="1"
            max="50"
            value="1"
            oninput="updatePeople()"
          >

        </div>

      </div>


      <div
        class="participants"
        id="participants"
      >

        ${participantInput(1)}

      </div>


      <!-- PAGAMENTO -->

      <div class="payment-title">
        Pagamento
      </div>


      <div class="payment-buttons">

        <button
          id="payYes"
          class="pay-btn"
          onclick="selectPayment(true)"
        >
          ✓ PAGATO
        </button>


        <button
          id="payNo"
          class="pay-btn active-unpaid"
          onclick="selectPayment(false)"
        >
          ✕ NO PAGATO
        </button>

      </div>


      <div
        id="amountBox"
        class="amount-box"
        style="display:none"
      >

        <label>
          Importo pagato (€)
        </label>

        <input
          id="amount"
          type="number"
          min="0"
          step="0.01"
          value="${state.price}"
        >

      </div>


      <div
        id="paymentHint"
        class="subtitle"
        style="margin:10px 0 0"
      >
        Da pagare:
        €${state.price.toFixed(2)}
        per persona
      </div>


      <button
        id="createBtn"
        class="primary"
        onclick="createBooking()"
      >
        Crea prenotazione e codice
      </button>


      <div id="createMessage"></div>

    </div>

  `;
}


/* ============================================================
   INPUT PARTECIPANTI
   ============================================================ */

function participantInput(number) {

  return `

    <div class="participant">

      <label>
        Partecipante ${number}
      </label>

      <input
        class="personInput"
        placeholder="Nome partecipante"
      >

    </div>

  `;
}


function updatePeople() {

  const input =
    document.getElementById(
      'peopleCount'
    );

  let count =
    Number(input.value);


  if (!count || count < 1) {
    count = 1;
  }

  if (count > 50) {
    count = 50;
  }


  input.value =
    count;


  let html = '';

  for (
    let i = 1;
    i <= count;
    i++
  ) {

    html +=
      participantInput(i);
  }


  document.getElementById(
    'participants'
  ).innerHTML = html;
}


/* ============================================================
   PAGAMENTO
   ============================================================ */

function selectPayment(paid) {

  state.paymentPaid =
    paid;


  const yes =
    document.getElementById(
      'payYes'
    );

  const no =
    document.getElementById(
      'payNo'
    );

  const amountBox =
    document.getElementById(
      'amountBox'
    );

  const hint =
    document.getElementById(
      'paymentHint'
    );


  if (paid) {

    yes.classList.add(
      'active-paid'
    );

    no.classList.remove(
      'active-unpaid'
    );

    amountBox.style.display =
      'block';

    hint.textContent =
      'Inserisci l’importo effettivamente pagato.';

  } else {

    no.classList.add(
      'active-unpaid'
    );

    yes.classList.remove(
      'active-paid'
    );

    amountBox.style.display =
      'none';


    const count =
      Number(
        document.getElementById(
          'peopleCount'
        ).value || 1
      );


    hint.textContent =
      'Da pagare: €' +
      (state.price * count)
        .toFixed(2);

  }
}


/* ============================================================
   CREAZIONE PRENOTAZIONE
   ============================================================ */

async function createBooking() {

  const btn =
    document.getElementById(
      'createBtn'
    );


  const message =
    document.getElementById(
      'createMessage'
    );


  const co =
    document.getElementById(
      'co'
    ).value.trim();


  const phone =
    document.getElementById(
      'phone'
    ).value.trim();


  const names =
    Array.from(
      document.querySelectorAll(
        '.personInput'
      )
    )
    .map(
      x => x.value.trim()
    )
    .filter(Boolean);


  if (!co) {

    message.innerHTML =
      '<div class="message error">Inserisci il C/O.</div>';

    return;
  }


  if (!names.length) {

    message.innerHTML =
      '<div class="message error">Inserisci almeno un partecipante.</div>';

    return;
  }


  btn.disabled = true;

  btn.textContent =
    'Salvataggio...';


  try {

    const amountInput =
      document.getElementById(
        'amount'
      );


    const amount =
      state.paymentPaid
        ? Number(
            amountInput.value || 0
          )
        : 0;


    const result =
      await api(
        'create',
        {

          co,

          phone,

          names,

          paid:
            state.paymentPaid,

          amount
        }
      );


    /*
     * Aggiorna subito la UI
     * senza fare una seconda init.
     */

    state.free =
      result.free;


    state.list.unshift(
      result.b
    );


    message.innerHTML = `

      <div class="message success">

        Prenotazione creata.
        Codice:
        <b>${result.code}</b>

        <br><br>

        <button
          class="invite"
          onclick="shareInvite('${result.code}')"
        >
          Condividi invito
        </button>

      </div>

    `;


    document.getElementById(
      'co'
    ).value = '';

    document.getElementById(
      'phone'
    ).value = '';


    document.getElementById(
      'peopleCount'
    ).value = '1';


    updatePeople();

    state.paymentPaid =
      false;

    selectPayment(false);


    /*
     * Aggiorna solo la lista.
     */

    document.getElementById(
      'bookingList'
    ).innerHTML =
      renderBookings(
        state.list
      );


  } catch (err) {

    message.innerHTML = `

      <div class="message error">

        ${escapeHtml(
          err.message
        )}

      </div>

    `;

  } finally {

    btn.disabled = false;

    btn.textContent =
      'Crea prenotazione e codice';
  }
}


/* ============================================================
   INVITO
   ============================================================ */

function inviteText(code) {

  return (
    'Ciao Sei Benvenuto alla festa Indiana ' +
    'il tuo codice di accesso è il seguente: ' +
    code
  );
}


async function shareInvite(code) {

  const text =
    inviteText(code);


  /*
   * Sul telefono apre direttamente
   * la condivisione.
   */

  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        text: text
      });

      return;

    } catch (e) {

      /*
       * L'utente può aver chiuso
       * la finestra di condivisione.
       */

      return;
    }
  }


  /*
   * Desktop / browser senza share.
   */

  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      'Messaggio copiato. Puoi incollarlo su WhatsApp.'
    );

  } catch (e) {

    prompt(
      'Copia questo messaggio:',
      text
    );
  }
}


/* ============================================================
   PRENOTAZIONI
   ============================================================ */

function renderBookings(list) {

  if (!list.length) {

    return `
      <div class="empty">
        Nessuna prenotazione.
      </div>
    `;
  }


  return list
    .map(
      g => renderBooking(g)
    )
    .join('');
}


function renderBooking(g) {

  const people =
    g.att || [];


  const count =
    people.length;


  const due =
    state.price * count;


  let paymentHTML;


  if (g.paid) {

    paymentHTML = `

      <div class="payment-status paid">

        ✓ PAGATO ·
        €${Number(
          g.amount || 0
        ).toFixed(2)}

      </div>

    `;

  } else {

    paymentHTML = `

      <div class="payment-status unpaid">

        ✕ NON PAGATO ·
        -€${due.toFixed(2)}

      </div>

    `;
  }


  const peopleHTML =
    people
      .map(
        p => `

          <div class="person">

            ${escapeHtml(
              p.n
            )}

            ${
              p.e
                ? ' · ✓ ENTRATO'
                : ''
            }

          </div>

        `
      )
      .join('');


  return `

    <div
      class="booking"
      data-code="${escapeHtml(g.code)}"
      data-search="${escapeHtml(
        (
          g.code +
          ' ' +
          g.co +
          ' ' +
          g.phone +
          ' ' +
          people.map(
            p => p.n
          ).join(' ')
        ).toLowerCase()
      )}"
    >

      <div class="booking-top">

        <div>

          <div class="booking-name">

            C/O
            ${escapeHtml(g.co)}

          </div>


          <div class="booking-meta">

            ${escapeHtml(g.phone)}

            ·

            ${count}
            ${
              count === 1
                ? 'persona'
                : 'persone'
            }

          </div>

        </div>


        <div class="code">

          ${escapeHtml(g.code)}

        </div>

      </div>


      <div class="people">

        ${peopleHTML}

      </div>


      ${paymentHTML}


      <div class="booking-actions">

        <button
          class="invite"
          onclick="shareInvite('${escapeHtml(g.code)}')"
        >
          Invia codice
        </button>


        ${
          state.role === 'admin' ||
          g.by === state.name
            ? `
              <button
                class="secondary"
                onclick="editPayment('${escapeHtml(g.code)}')"
              >
                ${
                  g.paid
                    ? 'Modifica pagamento'
                    : 'Segna pagato'
                }
              </button>
            `
            : ''
        }


        ${
          state.role === 'admin'
            ? `
              <button
                class="secondary"
                onclick="openAdmission('${escapeHtml(g.code)}')"
              >
                Ingresso
              </button>
            `
            : ''
        }

      </div>

    </div>

  `;
}


/* ============================================================
   MODIFICA PAGAMENTO
   ============================================================ */

async function editPayment(code) {

  const booking =
    state.list.find(
      g => g.code === code
    );


  if (!booking) {
    return;
  }


  const count =
    booking.att.length;


  const due =
    state.price * count;


  const paid =
    confirm(
      booking.paid
        ? 'Il pagamento è già segnato come PAGATO.\n\nOK = modificare importo\nAnnulla = impostare NON PAGATO'
        : 'Vuoi segnare questa prenotazione come PAGATA?'
    );


  if (!paid) {

    if (
      booking.paid &&
      !confirm(
        'Impostare la prenotazione come NON PAGATA?'
      )
    ) {
      return;
    }


    try {

      await api(
        'paid',
        {
          code,
          value: false,
          amount: 0
        }
      );


      booking.paid =
        false;

      booking.amount =
        0;


      refreshList();

    } catch (e) {

      alert(
        e.message
      );
    }

    return;
  }


  const defaultAmount =
    booking.amount ||
    due;


  const amount =
    prompt(
      'Inserisci importo pagato (€):',
      Number(
        defaultAmount
      ).toFixed(2)
    );


  if (
    amount === null
  ) {
    return;
  }


  const number =
    Number(
      amount.replace(',', '.')
    );


  if (
    !isFinite(number) ||
    number < 0
  ) {

    alert(
      'Importo non valido.'
    );

    return;
  }


  try {

    await api(
      'paid',
      {
        code,
        value: true,
        amount: number
      }
    );


    booking.paid =
      true;

    booking.amount =
      number;


    refreshList();

  } catch (e) {

    alert(
      e.message
    );
  }
}


/* ============================================================
   REFRESH
   ============================================================ */

async function refresh() {

  try {

    const data =
      await api('init');


    state.free =
      data.free;

    state.used =
      data.used;

    state.list =
      data.list || [];


    refreshList();

  } catch (e) {

    alert(
      e.message
    );
  }
}


function refreshList() {

  const box =
    document.getElementById(
      'bookingList'
    );


  if (box) {

    box.innerHTML =
      renderBookings(
        state.list
      );
  }
}


/* ============================================================
   RICERCA ADMIN
   ============================================================ */

function filterBookings() {

  const input =
    document.getElementById(
      'search'
    );


  if (!input) {
    return;
  }


  const query =
    input.value
      .trim()
      .toLowerCase();


  const elements =
    document.querySelectorAll(
      '.booking'
    );


  elements.forEach(
    el => {

      const text =
        el.dataset.search ||
        '';


      el.style.display =
        !query ||
        text.includes(query)
          ? ''
          : 'none';
    }
  );
}


/* ============================================================
   ADMIN TOOLS
   ============================================================ */

function renderAdminTools() {

  return `

    <div class="card">

      <b>
        Controllo ingressi
      </b>

      <div
        class="admin-tools"
        style="margin-top:12px"
      >

        <div class="admit-box">

          <input
            id="admitCode"
            placeholder="Inserisci codice 4 cifre"
            inputmode="numeric"
            maxlength="4"
          >

          <button
            class="primary"
            style="margin:0"
            onclick="checkAdmission()"
          >
            Controlla
          </button>

        </div>


        <div id="admitResult"></div>

      </div>

    </div>

  `;
}


/* ============================================================
   CONTROLLO INGRESSO
   ============================================================ */

async function checkAdmission() {

  const input =
    document.getElementById(
      'admitCode'
    );


  const code =
    input.value.trim();


  if (
    !/^\d{4}$/.test(code)
  ) {

    alert(
      'Inserisci un codice di 4 cifre.'
    );

    return;
  }


  const box =
    document.getElementById(
      'admitResult'
    );


  try {

    const result =
      await api(
        'scan',
        {
          code
        }
      );


    if (
      result.status ===
      'invalid'
    ) {

      box.innerHTML = `
        <div class="message error">
          Codice non trovato.
        </div>
      `;

      return;
    }


    if (
      result.status ===
      'cancelled'
    ) {

      box.innerHTML = `
        <div class="message error">
          Prenotazione annullata.
        </div>
      `;

      return;
    }


    const g =
      result.b;


    box.innerHTML = `

      <div class="card">

        <b>
          C/O ${escapeHtml(g.co)}
        </b>

        <p>
          Codice:
          <b>${escapeHtml(g.code)}</b>
        </p>

        <div>

          ${
            g.att
              .map(
                p => `

                  <label
                    style="
                      display:flex;
                      align-items:center;
                      gap:8px;
                      margin:8px 0;
                    "
                  >

                    <input
                      type="checkbox"
                      class="admitPerson"
                      value="${p.k}"
                      ${
                        p.e
                          ? 'disabled checked'
                          : ''
                      }
                    >

                    ${escapeHtml(p.n)}

                    ${
                      p.e
                        ? ' ✓ entrato'
                        : ''
                    }

                  </label>

                `
              )
              .join('')
          }

        </div>


        <button
          class="primary"
          onclick="admitSelected('${escapeHtml(g.code)}')"
        >
          Segna ingresso
        </button>

      </div>

    `;

  } catch (e) {

    box.innerHTML = `

      <div class="message error">

        ${escapeHtml(
          e.message
        )}

      </div>

    `;
  }
}


/* ============================================================
   AMMISSIONE
   ============================================================ */

async function admitSelected(code) {

  const checked =
    Array.from(
      document.querySelectorAll(
        '.admitPerson:checked:not(:disabled)'
      )
    )
    .map(
      el => Number(el.value)
    );


  if (!checked.length) {

    alert(
      'Seleziona almeno una persona.'
    );

    return;
  }


  try {

    const result =
      await api(
        'admit',
        {
          code,
          idx: checked
        }
      );


    alert(
      result.entered.length
        ? 'Ingresso registrato: ' +
          result.entered.join(', ')
        : 'Nessun ingresso registrato.'
    );


    await refresh();

    /*
     * Aggiorna anche il pannello admin.
     */

    const input =
      document.getElementById(
        'admitCode'
      );


    if (input) {

      input.value =
        code;

      await checkAdmission();
    }

  } catch (e) {

    alert(
      e.message
    );
  }
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}


/* ============================================================
   HASH CHANGE
   ============================================================ */

window.addEventListener(
  'hashchange',
  () => {

    init();

  }
);


/* ============================================================
   AVVIO
   ============================================================ */

init();

</script>
