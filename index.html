<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ingressi Festa</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f2ff;

  color: #18152f;
}


body.admin {
  background: #f4f4f4;
  color: #111;
}


.app {

  width: min(100% - 32px, 700px);

  margin: 0 auto;

  padding: 22px 0 60px;

}


.header {

  margin-bottom: 25px;

}


.userBadge {

  display: inline-block;

  padding: 7px 15px;

  border-radius: 999px;

  background: #7c3aed;

  color: white;

  font-size: 13px;

  font-weight: 800;

  margin-bottom: 8px;

}


body.molly .userBadge {
  background: #db2777;
}


body.anuraj .userBadge {
  background: #7c3aed;
}


body.admin .userBadge {

  background: #111;

  color: white;

}


h1 {

  margin: 0 0 5px;

  font-size: 32px;

  line-height: 1.1;

}


.subtitle {

  color: #6d668c;

  font-size: 16px;

}


body.admin .subtitle {
  color: #555;
}


.card {

  background: white;

  border: 1px solid #ddd6fe;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 18px;

}


body.admin .card {

  border-color: #ddd;

}


label {

  display: block;

  margin-bottom: 7px;

  color: #716b91;

  font-size: 14px;

}


input {

  width: 100%;

  padding: 13px;

  border-radius: 11px;

  border: 1px solid #ddd6fe;

  background: #faf9ff;

  color: #18152f;

  font-size: 16px;

  outline: none;

}


input:focus {

  border-color: #7c3aed;

}


.row {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

}


button {

  border: 0;

  border-radius: 11px;

  padding: 12px 15px;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

}


button:disabled {

  opacity: .5;

  cursor: not-allowed;

}


.primary {

  width: 100%;

  margin-top: 16px;

  background: #7c3aed;

  color: white;

}


body.molly .primary {
  background: #db2777;
}


body.admin .primary {

  background: #111;

  color: white;

}


.secondary {

  background: white;

  border: 1px solid #ddd6fe;

  color: #29243f;

}


body.admin .secondary {

  border-color: #bbb;

  color: #111;

}


.danger {

  background: #fee2e2;

  color: #b91c1c;

}


.success {

  background: #dcfce7;

  color: #15803d;

}


/* ==========================================================
   PAGAMENTO
   ========================================================== */

.paymentTitle {

  margin-top: 16px;

  margin-bottom: 8px;

  color: #716b91;

  font-size: 14px;

}


.paymentButtons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

}


.payButton {

  padding: 13px;

  border-radius: 12px;

  border: 1px solid #ddd6fe;

  background: white;

  color: #211d38;

}


.payButton.activePaid {

  background: #12845f;

  border-color: #12845f;

  color: white;

}


.payButton.activeUnpaid {

  background: #dc2626;

  border-color: #dc2626;

  color: white;

}


.amountBox {

  margin-top: 12px;

}


.amountHint {

  margin-top: 7px;

  font-size: 13px;

  color: #777;

}


/* ==========================================================
   PRENOTAZIONE
   ========================================================== */

.booking {

  position: relative;

}


.bookingHeader {

  display: flex;

  justify-content: space-between;

  gap: 15px;

  align-items: flex-start;

}


.bookingName {

  font-size: 19px;

  font-weight: 850;

}


.bookingInfo {

  color: #726c91;

  margin-top: 5px;

  font-size: 14px;

}


.code {

  font-size: 25px;

  font-weight: 900;

  letter-spacing: 4px;

  background: #f5f3ff;

  padding: 9px 13px;

  border-radius: 12px;

  white-space: nowrap;

}


body.admin .code {

  background: #eee;

  color: #111;

}


.participants {

  margin-top: 14px;

}


.participant {

  padding: 8px 0;

  border-bottom: 1px solid #eee;

}


.participant:last-child {
  border-bottom: 0;
}


.paymentStatus {

  margin-top: 13px;

  font-size: 15px;

  font-weight: 900;

}


.paymentPaid {

  color: #12845f;

}


.paymentUnpaid {

  color: #dc2626;

}


.bookingActions {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 14px;

}


/* ==========================================================
   MESSAGGIO
   ========================================================== */

.messageBox {

  margin-top: 14px;

  padding: 13px;

  border-radius: 12px;

  background: #f8f7ff;

  border: 1px solid #e3defa;

  white-space: pre-line;

  font-size: 14px;

  line-height: 1.5;

}


body.admin .messageBox {

  background: #f5f5f5;

  border-color: #ddd;

}


/* ==========================================================
   ADMIN SCANNER
   ========================================================== */

.adminPanel {

  background: #111;

  color: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 18px;

}


.adminPanel label {

  color: #bbb;

}


.adminPanel input {

  background: #222;

  color: white;

  border-color: #444;

}


.scannerResult {

  margin-top: 15px;

  padding: 15px;

  background: #222;

  border-radius: 12px;

}


.checkRow {

  display: flex;

  align-items: center;

  gap: 9px;

  padding: 8px 0;

}


.checkRow input {

  width: 18px;

  height: 18px;

}


/* ==========================================================
   STATI
   ========================================================== */

.notice {

  padding: 11px 13px;

  border-radius: 11px;

  margin-bottom: 15px;

  background: #f1f0ff;

  color: #514b71;

}


.error {

  background: #fee2e2;

  color: #991b1b;

}


.ok {

  background: #dcfce7;

  color: #166534;

}


.loading {

  text-align: center;

  padding: 35px 10px;

  color: #777;

}


.hidden {
  display: none !important;
}


.refresh {

  margin-bottom: 15px;

}


.small {

  font-size: 13px;

  color: #777;

}


@media(max-width:600px) {

  .row {

    grid-template-columns: 1fr;

  }

  .bookingHeader {

    flex-direction: column;

  }

  .code {

    align-self: flex-start;

  }

  .paymentButtons {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>

<div class="app">

  <div id="loading" class="loading">
    Caricamento...
  </div>


  <div id="appContent" class="hidden">

    <div class="header">

      <div id="userBadge" class="userBadge"></div>

      <h1>Ingressi festa</h1>

      <div class="subtitle">
        Posti ancora liberi:
        <strong id="freePlaces">-</strong>
      </div>

    </div>


    <div id="notice"></div>


    <!-- =====================================================
         FORM ORGANIZZATORE
         ===================================================== -->

    <div
      id="createCard"
      class="card hidden"
    >

      <label>C/O (chi prenota)</label>

      <input
        id="co"
        placeholder="Nome e cognome"
      >


      <div class="row">

        <div>

          <label>Telefono</label>

          <input
            id="phone"
            placeholder="333 1234567"
            inputmode="tel"
          >

        </div>


        <div>

          <label>Persone</label>

          <input
            id="count"
            type="number"
            min="1"
            max="50"
            value="1"
          >

        </div>

      </div>


      <div
        id="participants"
        style="margin-top:12px"
      ></div>


      <!-- ===================================================
           PAGAMENTO
           =================================================== -->

      <div class="paymentTitle">
        Pagamento
      </div>


      <div class="paymentButtons">

        <button
          id="paidBtn"
          class="payButton activePaid"
          type="button"
          onclick="setCreatePayment(true)"
        >
          ✓ PAGATO
        </button>


        <button
          id="unpaidBtn"
          class="payButton"
          type="button"
          onclick="setCreatePayment(false)"
        >
          DA PAGARE
        </button>

      </div>


      <div
        id="createAmountBox"
        class="amountBox"
      >

        <label>Importo pagato (€)</label>

        <input
          id="createAmount"
          type="number"
          step="0.01"
          min="0"
          value="25"
        >

        <div class="amountHint">
          Prezzo previsto:
          €<span id="expectedPrice">25</span>
        </div>

      </div>


      <button
        id="createBtn"
        class="primary"
        onclick="createBooking()"
      >
        Crea prenotazione e codice
      </button>

    </div>


    <!-- =====================================================
         ADMIN SCANNER
         ===================================================== -->

    <div
      id="adminPanel"
      class="adminPanel hidden"
    >

      <strong>
        Controllo ingresso
      </strong>


      <div style="margin-top:12px">

        <label>
          Inserisci codice
        </label>

        <input
          id="scanCode"
          maxlength="4"
          placeholder="Es. 2245"
          inputmode="numeric"
          onkeydown="if(event.key==='Enter') scanCode()"
        >

      </div>


      <button
        class="primary"
        style="background:white;color:#111"
        onclick="scanCode()"
      >
        Controlla codice
      </button>


      <div
        id="scannerResult"
        class="scannerResult hidden"
      ></div>

    </div>


    <button
      class="secondary refresh"
      onclick="loadData(true)"
    >
      ↻ Aggiorna
    </button>


    <div
      id="updated"
      class="small"
      style="margin-bottom:12px"
    ></div>


    <div id="bookings"></div>

  </div>

</div>


<script>


/* ============================================================
   CONFIGURAZIONE
   ============================================================ */


/*
  METTI QUI L'URL DELLA TUA WEB APP GOOGLE APPS SCRIPT.

  Esempio:

  const API =
    'https://script.google.com/macros/s/XXXXXXXX/exec';
*/

const API =
  'https://script.google.com/macros/s/AKfycbxO-R2yW13gYo4jHB-rls7jxcv-GDUsv8jsaFsWVwkTLRmrkc4RRERwDSSPU8HUMLov/exec';


/* ============================================================
   STATO
   ============================================================ */

let currentUser = null;

let currentRole = null;

let data = null;

let createPaid = true;


/* ============================================================
   IDENTIFICA UTENTE DALL'HASH
   ============================================================ */

function getUserFromHash() {

  let hash =
    window.location.hash
      .replace('#', '')
      .trim()
      .toLowerCase();


  if (
    hash !== 'admin' &&
    hash !== 'molly' &&
    hash !== 'anuraj'
  ) {

    /*
      Default organizzatore.
      Se vuoi obbligare l'utente a usare
      #anuraj / #molly / #admin,
      cambia qui.
    */

    hash = 'anuraj';

  }


  return hash;

}


/* ============================================================
   RICHIESTA API
   ============================================================ */

async function api(action, extra = {}) {

  const payload = {

    action: action,

    user: currentUser,

    rid:
      Date.now().toString() +
      Math.random().toString(36).slice(2),

    ...extra

  };


  const response =
    await fetch(API, {

      method: 'POST',

      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },

      body: JSON.stringify(payload)

    });


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(text);

  } catch (e) {

    console.error(text);

    throw new Error(
      'Risposta non valida da Google'
    );

  }


  if (!result.ok) {

    throw new Error(
      result.error ||
      'Errore del server'
    );

  }


  return result;

}


/* ============================================================
   INIT
   ============================================================ */

async function start() {

  currentUser =
    getUserFromHash();


  document.body.classList.add(
    currentUser
  );


  try {

    data =
      await api('init');


    currentRole =
      data.role;


    document
      .getElementById('loading')
      .classList.add('hidden');


    document
      .getElementById('appContent')
      .classList.remove('hidden');


    document
      .getElementById('userBadge')
      .textContent =
        data.name;


    document
      .getElementById('freePlaces')
      .textContent =
        data.free;


    if (data.role === 'admin') {

      document
        .getElementById('adminPanel')
        .classList.remove('hidden');

    } else {

      document
        .getElementById('createCard')
        .classList.remove('hidden');

      updateParticipants();

    }


    renderBookings();


    document
      .getElementById('updated')
      .textContent =
        'Aggiornato alle ' +
        new Date()
          .toLocaleTimeString('it-IT');


  } catch (err) {

    document
      .getElementById('loading')
      .innerHTML =
        '<div class="notice error">' +
        escapeHtml(err.message) +
        '</div>';

  }

}


/* ============================================================
   REFRESH
   ============================================================ */

async function loadData(showMessage = false) {

  try {

    if (showMessage) {

      showNotice(
        'Aggiornamento...',
        ''
      );

    }


    data =
      await api('init');


    document
      .getElementById('freePlaces')
      .textContent =
      data.free;


    renderBookings();


    document
      .getElementById('updated')
      .textContent =
      'Aggiornato alle ' +
      new Date()
        .toLocaleTimeString('it-IT');


    if (showMessage) {

      showNotice(
        'Dati aggiornati',
        'ok'
      );

    }


  } catch (err) {

    showNotice(
      err.message,
      'error'
    );

  }

}


/* ============================================================
   PARTECIPANTI
   ============================================================ */

function updateParticipants() {

  const count =
    Math.max(
      1,
      Math.min(
        50,
        Number(
          document.getElementById('count').value
        ) || 1
      )
    );


  document.getElementById('count').value =
    count;


  const container =
    document.getElementById('participants');


  const oldValues = [];


  container
    .querySelectorAll('input')
    .forEach(function(input) {

      oldValues.push(input.value);

    });


  container.innerHTML = '';


  for (let i = 0; i < count; i++) {

    const label =
      document.createElement('label');

    label.textContent =
      'Partecipante ' + (i + 1);


    const input =
      document.createElement('input');

    input.className =
      'participantInput';

    input.placeholder =
      'Nome partecipante ' + (i + 1);

    input.value =
      oldValues[i] || '';


    input.style.marginBottom =
      '9px';


    container.appendChild(label);

    container.appendChild(input);

  }


  const price =
    count *
    Number(data?.price || 25);


  document
    .getElementById('expectedPrice')
    .textContent =
    price.toFixed(2);


  if (
    createPaid &&
    !document.getElementById('createAmount').dataset.edited
  ) {

    document
      .getElementById('createAmount')
      .value =
      price.toFixed(2);

  }

}


document
  .getElementById('count')
  .addEventListener(
    'input',
    updateParticipants
  );


document
  .getElementById('createAmount')
  .addEventListener(
    'input',
    function() {

      this.dataset.edited =
        '1';

    }
  );


/* ============================================================
   PAGAMENTO CREAZIONE
   ============================================================ */

function setCreatePayment(paid) {

  createPaid =
    paid;


  const paidBtn =
    document.getElementById('paidBtn');

  const unpaidBtn =
    document.getElementById('unpaidBtn');

  const amountBox =
    document.getElementById('createAmountBox');


  paidBtn.classList.toggle(
    'activePaid',
    paid
  );


  unpaidBtn.classList.toggle(
    'activeUnpaid',
    !paid
  );


  amountBox.classList.toggle(
    'hidden',
    !paid
  );


  if (paid) {

    const count =
      Number(
        document.getElementById('count').value
      ) || 1;


    const expected =
      count *
      Number(data?.price || 25);


    const input =
      document.getElementById('createAmount');


    if (!input.dataset.edited) {

      input.value =
        expected.toFixed(2);

    }

  }

}


/* ============================================================
   CREA PRENOTAZIONE
   ============================================================ */

async function createBooking() {

  const button =
    document.getElementById('createBtn');


  const co =
    document
      .getElementById('co')
      .value
      .trim();


  const phone =
    document
      .getElementById('phone')
      .value
      .trim();


  const names =
    Array.from(
      document.querySelectorAll(
        '.participantInput'
      )
    )
    .map(function(input) {

      return input.value.trim();

    });


  if (!co) {

    showNotice(
      'Inserisci il nome C/O',
      'error'
    );

    return;

  }


  if (
    names.some(function(name) {
      return !name;
    })
  ) {

    showNotice(
      'Inserisci tutti i nomi dei partecipanti',
      'error'
    );

    return;

  }


  let amount = 0;


  if (createPaid) {

    amount =
      Number(
        document
          .getElementById('createAmount')
          .value
      );


    if (!amount || amount <= 0) {

      showNotice(
        'Inserisci l’importo pagato',
        'error'
      );

      return;

    }

  }


  button.disabled = true;

  button.textContent =
    'Salvataggio...';


  try {

    const result =
      await api(
        'create',
        {

          co: co,

          phone: phone,

          names: names,

          paid: createPaid,

          amount: amount

        }
      );


    showNotice(
      'Prenotazione creata. Codice: ' +
      result.code,
      'ok'
    );


    /*
      Aggiorniamo subito la lista
      senza dover aspettare un altro refresh.
    */

    await loadData(false);


    /*
      Mostra automaticamente
      il messaggio di invito
      della nuova prenotazione.
    */

    showInvite(
      result.b
    );


    /*
      Reset form.
    */

    document
      .getElementById('co')
      .value = '';

    document
      .getElementById('phone')
      .value = '';

    document
      .getElementById('count')
      .value = 1;

    document
      .getElementById('createAmount')
      .dataset.edited = '';

    document
      .getElementById('createAmount')
      .value = '25';

    createPaid = true;

    setCreatePayment(true);

    updateParticipants();


  } catch (err) {

    showNotice(
      err.message,
      'error'
    );

  } finally {

    button.disabled = false;

    button.textContent =
      'Crea prenotazione e codice';

  }

}


/* ============================================================
   RENDER PRENOTAZIONI
   ============================================================ */

function renderBookings() {

  const container =
    document.getElementById('bookings');


  container.innerHTML = '';


  if (
    !data ||
    !data.list ||
    !data.list.length
  ) {

    container.innerHTML =
      '<div class="card">' +
      '<strong>Nessuna prenotazione</strong>' +
      '</div>';

    return;

  }


  data.list.forEach(function(booking) {

    container.appendChild(
      createBookingCard(booking)
    );

  });

}


/* ============================================================
   CARD PRENOTAZIONE
   ============================================================ */

function createBookingCard(b) {

  const card =
    document.createElement('div');


  card.className =
    'card booking';


  const people =
    b.att.length;


  const due =
    people *
    Number(data.price || 25);


  let html = '';


  html +=
    '<div class="bookingHeader">';


  html +=
    '<div>';


  html +=
    '<div class="bookingName">' +
    'C/O ' +
    escapeHtml(b.co) +
    '</div>';


  html +=
    '<div class="bookingInfo">' +
    escapeHtml(b.phone) +
    ' · ' +
    people +
    (
      people === 1
        ? ' persona'
        : ' persone'
    ) +
    '</div>';


  html +=
    '</div>';


  html +=
    '<div class="code">' +
    escapeHtml(b.code) +
    '</div>';


  html +=
    '</div>';


  html +=
    '<div class="participants">';


  b.att.forEach(function(p) {

    html +=
      '<div class="participant">' +
      escapeHtml(p.n);


    if (p.e) {

      html +=
        ' <span class="small">' +
        '✓ entrato' +
        (
          p.t
            ? ' · ' + escapeHtml(p.t)
            : ''
        ) +
        '</span>';

    }


    html +=
      '</div>';

  });


  html +=
    '</div>';


  /*
    PAGAMENTO
  */

  if (b.paid) {

    html +=
      '<div class="paymentStatus paymentPaid">' +
      '✓ PAGATO · €' +
      Number(b.amount || 0)
        .toFixed(2) +
      '</div>';

  } else {

    html +=
      '<div class="paymentStatus paymentUnpaid">' +
      '✕ DA PAGARE · €' +
      due.toFixed(2) +
      '</div>';

  }


  html +=
    '<div class="bookingActions">';


  /*
    ORGANIZZATORE:
    gestione pagamento
  */

  if (currentRole === 'org') {

    if (b.paid) {

      html +=
        '<button class="secondary" ' +
        'onclick="openPayment(\'' +
        escapeAttr(b.code) +
        '\', true, ' +
        Number(b.amount || 0) +
        ')">' +
        'Modifica pagamento' +
        '</button>';

    } else {

      html +=
        '<button class="success" ' +
        'onclick="openPayment(\'' +
        escapeAttr(b.code) +
        '\', false, ' +
        due +
        ')">' +
        'Segna pagato' +
        '</button>';

    }


    html +=
      '<button class="primary" ' +
      'style="width:auto;margin-top:0" ' +
      'onclick="showInviteFromCode(\'' +
      escapeAttr(b.code) +
      '\')">' +
      'Invia codice' +
      '</button>';

  }


  /*
    ADMIN
  */

  if (currentRole === 'admin') {

    html +=
      '<button class="secondary" ' +
      'onclick="scanDirect(\'' +
      escapeAttr(b.code) +
      '\')">' +
      'Controlla ingresso' +
      '</button>';


    if (b.paid) {

      html +=
        '<button class="secondary" ' +
        'onclick="openPayment(\'' +
        escapeAttr(b.code) +
        '\', true, ' +
        Number(b.amount || 0) +
        ')">' +
        'Modifica pagamento' +
        '</button>';

    } else {

      html +=
        '<button class="success" ' +
        'onclick="openPayment(\'' +
        escapeAttr(b.code) +
        '\', false, ' +
        due +
        ')">' +
        'Segna pagato' +
        '</button>';

    }

  }


  html +=
    '</div>';


  card.innerHTML =
    html;


  return card;

}


/* ============================================================
   PAGAMENTO
   ============================================================ */

async function openPayment(
  code,
  currentlyPaid,
  currentAmount
) {

  let amount = 0;


  if (!currentlyPaid) {

    amount =
      Number(
        prompt(
          'Inserisci l’importo pagato (€):',
          Number(currentAmount || 25)
            .toFixed(2)
        )
      );


    if (!amount || amount <= 0) {

      return;

    }

  } else {

    amount =
      Number(
        prompt(
          'Modifica importo pagato (€):',
          Number(currentAmount || 0)
            .toFixed(2)
        )
      );


    if (!amount || amount <= 0) {

      return;

    }

  }


  try {

    await api(
      'paid',
      {

        code: code,

        value: true,

        amount: amount

      }
    );


    showNotice(
      'Pagamento aggiornato: €' +
      amount.toFixed(2),
      'ok'
    );


    await loadData(false);


  } catch (err) {

    showNotice(
      err.message,
      'error'
    );

  }

}


/* ============================================================
   INVITO
   ============================================================ */

function makeInviteMessage(b) {

  const people =
    b.att.length;


  const names =
    b.att
      .map(function(p) {

        return p.n;

      })
      .join(', ');


  return (
    'Ciao ' +
    b.co +
    '! 👋\n\n' +

    'Sei il benvenuto alla Festa Indiana! 🎉\n\n' +

    'La tua prenotazione è stata registrata.\n\n' +

    'Partecipanti: ' +
    people +
    '\n' +

    'Nomi: ' +
    names +
    '\n\n' +

    '🔑 Il tuo codice di accesso è:\n\n' +

    b.code +
    '\n\n' +

    'Conserva questo codice e mostracelo all’ingresso.\n\n' +

    'A presto! 🎉'
  );

}


function showInvite(b) {

  if (!b) return;


  const message =
    makeInviteMessage(b);


  /*
    Dopo la creazione mostra
    il messaggio direttamente.
  */

  const old =
    document.getElementById(
      'inviteMessage'
    );


  if (old) old.remove();


  const box =
    document.createElement('div');


  box.id =
    'inviteMessage';

  box.className =
    'card';


  box.innerHTML =

    '<strong>📩 Invito pronto</strong>' +

    '<div class="messageBox">' +
    escapeHtml(message) +
    '</div>' +

    '<div class="bookingActions">' +

      '<button class="primary" ' +
      'style="width:auto;margin-top:0" ' +
      'onclick="shareInviteText(\'' +
      escapeAttr(message) +
      '\')">' +
      'Condividi invito' +
      '</button>' +

      '<button class="secondary" ' +
      'onclick="copyText(\'' +
      escapeAttr(message) +
      '\')">' +
      'Copia messaggio' +
      '</button>' +

      '<button class="secondary" ' +
      'onclick="whatsappText(\'' +
      escapeAttr(message) +
      '\')">' +
      'WhatsApp' +
      '</button>' +

    '</div>';


  const createCard =
    document.getElementById(
      'createCard'
    );


  createCard
    .parentNode
    .insertBefore(
      box,
      createCard.nextSibling
    );

}


function showInviteFromCode(code) {

  const booking =
    data.list.find(function(b) {

      return b.code === code;

    });


  if (booking) {

    showInvite(booking);

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }

}


/* ============================================================
   CONDIVISIONE
   ============================================================ */

async function shareInviteText(text) {

  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          'Invito Festa Indiana',

        text: text

      });

      return;

    } catch (e) {}

  }


  await copyText(text);

  showNotice(
    'Messaggio copiato. Ora puoi incollarlo su WhatsApp.',
    'ok'
  );

}


async function copyText(text) {

  try {

    await navigator.clipboard.writeText(
      text
    );

  } catch (e) {

    const area =
      document.createElement('textarea');

    area.value =
      text;

    document.body.appendChild(area);

    area.select();

    document.execCommand('copy');

    area.remove();

  }


  showNotice(
    'Messaggio copiato!',
    'ok'
  );

}


function whatsappText(text) {

  const url =
    'https://wa.me/?text=' +
    encodeURIComponent(text);


  window.open(
    url,
    '_blank'
  );

}


/* ============================================================
   ADMIN SCANNER
   ============================================================ */

async function scanCode() {

  const input =
    document.getElementById(
      'scanCode'
    );


  const code =
    input.value.trim();


  if (
    !/^\d{4}$/.test(code)
  ) {

    showScannerError(
      'Inserisci un codice di 4 cifre.'
    );

    return;

  }


  await scanDirect(code);

}


async function scanDirect(code) {

  const result =
    document.getElementById(
      'scannerResult'
    );


  result.classList.remove(
    'hidden'
  );


  result.innerHTML =
    'Controllo...';


  try {

    const r =
      await api(
        'scan',
        {
          code: code
        }
      );


    if (
      r.status === 'invalid'
    ) {

      result.innerHTML =
        '<strong>❌ Codice non valido</strong>';

      return;

    }


    if (
      r.status === 'cancelled'
    ) {

      result.innerHTML =
        '<strong>❌ Prenotazione annullata</strong>';

      return;

    }


    const b =
      r.b;


    let html = '';


    html +=
      '<strong>' +
      escapeHtml(b.co) +
      '</strong>';


    html +=
      '<div style="margin-top:8px">' +
      escapeHtml(b.phone) +
      '</div>';


    if (
      r.status === 'used'
    ) {

      html +=
        '<div style="margin-top:10px;color:#fca5a5">' +
        '⚠ Tutte le persone sono già entrate.' +
        '</div>';

    }


    html +=
      '<div style="margin-top:12px">';


    b.att.forEach(function(p) {

      html +=

        '<label class="checkRow">' +

        '<input type="checkbox" ' +
        'value="' +
        p.k +
        '" ' +
        (
          p.e
            ? 'checked disabled'
            : ''
        ) +
        '>' +

        '<span>' +
        escapeHtml(p.n) +
        (
          p.e
            ? ' ✓ già entrato'
            : ''
        ) +
        '</span>' +

        '</label>';

    });


    html +=
      '</div>';


    if (
      r.status === 'valid'
    ) {

      html +=

        '<button ' +
        'class="primary" ' +
        'style="background:white;color:#111" ' +
        'onclick="admitSelected(\'' +
        escapeAttr(b.code) +
        '\')">' +
        'Conferma ingresso' +
        '</button>';

    }


    result.innerHTML =
      html;


  } catch (err) {

    result.innerHTML =
      '<strong style="color:#fca5a5">' +
      escapeHtml(err.message) +
      '</strong>';

  }

}


/* ============================================================
   CONFERMA INGRESSO
   ============================================================ */

async function admitSelected(code) {

  const checkboxes =
    document.querySelectorAll(
      '#scannerResult input[type="checkbox"]:checked:not(:disabled)'
    );


  const indexes =
    Array.from(
      checkboxes
    ).map(function(input) {

      return Number(input.value);

    });


  if (!indexes.length) {

    showScannerError(
      'Seleziona almeno una persona.'
    );

    return;

  }


  try {

    const result =
      await api(
        'admit',
        {

          code: code,

          idx: indexes

        }
      );


    showNotice(
      'Ingresso registrato: ' +
      result.entered.join(', '),
      'ok'
    );


    await loadData(false);


    await scanDirect(code);


  } catch (err) {

    showScannerError(
      err.message
    );

  }

}


/* ============================================================
   MESSAGGI
   ============================================================ */

function showNotice(
  message,
  type
) {

  const box =
    document.getElementById(
      'notice'
    );


  box.innerHTML =
    '<div class="notice ' +
    (type || '') +
    '">' +
    escapeHtml(message) +
    '</div>';

}


function showScannerError(message) {

  const box =
    document.getElementById(
      'scannerResult'
    );


  box.classList.remove(
    'hidden'
  );


  box.innerHTML =
    '<div style="color:#fca5a5">' +
    escapeHtml(message) +
    '</div>';

}


/* ============================================================
   SICUREZZA HTML
   ============================================================ */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttr(value) {

  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '');

}

   HASH
   ============================================================ */

window.addEventListener(
  'hashchange',
  function() {

    location.reload();

  }
);


/* ============================================================

start();
