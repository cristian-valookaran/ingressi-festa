<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ingressi festa</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    Arial,
    sans-serif;

  background: #f5f2ff;
  color: #17203a;
}

.app {
  width: min(620px, 94%);
  margin: 25px auto 60px;
}

.header {
  margin-bottom: 25px;
}

.user-badge {
  display: inline-block;

  padding: 8px 15px;

  border-radius: 999px;

  color: white;

  font-weight: 800;

  font-size: 13px;

  margin-bottom: 10px;
}

.admin {
  background: #17203a;
}

.anuraj {
  background: #d92b6d;
}

.molly {
  background: #6c4bd8;
}

h1 {
  margin: 0 0 5px;

  font-size: 32px;
}

.subtitle {
  color: #66708c;
}

.card {
  background: white;

  border: 1px solid #ddd8f0;

  border-radius: 20px;

  padding: 18px;

  margin-bottom: 18px;

  box-shadow:
    0 4px 18px
    rgba(40, 30, 80, .04);
}

label {
  display: block;

  font-size: 14px;

  color: #66708c;

  margin-bottom: 7px;

  font-weight: 600;
}

input,
select {

  width: 100%;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #ddd8f0;

  background: #f8f6ff;

  font-size: 16px;

  outline: none;
}

input:focus {
  border-color: #8a73e8;
}

.row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;
}

button {

  border: 0;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

  background: #d92b6d;

  color: white;
}

button.secondary {
  background: #eeeaf9;

  color: #313954;
}

button.green {
  background: #15966c;
}

button.red {
  background: #d94a4a;
}

button:disabled {
  opacity: .5;

  cursor: not-allowed;
}

.full {
  width: 100%;
}

.payment-row {

  display: flex;

  gap: 8px;

  margin-bottom: 10px;
}

.payment-row button {
  flex: 1;
}

.payment-row button.active {
  box-shadow:
    0 0 0 3px
    rgba(217,43,109,.18);
}

.amount {
  display: none;
}

.amount.show {
  display: block;
}

.booking {

  border-top:
    1px solid #e7e2f3;

  padding: 17px 0;

}

.booking:first-child {
  border-top: 0;
}

.booking-name {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 6px;
}

.booking-info {

  color: #66708c;

  font-size: 14px;

  margin-bottom: 10px;
}

.code {

  display: inline-block;

  background: #f0ecff;

  padding: 7px 10px;

  border-radius: 8px;

  font-weight: 900;

  letter-spacing: 2px;

  margin: 4px 0;
}

.status {

  display: inline-block;

  padding: 5px 9px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: 800;

  margin-left: 5px;
}

.paid {
  background: #d9f5e9;
  color: #127452;
}

.unpaid {
  background: #fff0cf;
  color: #936100;
}

.entered {
  background: #dceeff;
  color: #235b8f;
}

.cancelled {
  opacity: .5;
}

.person {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 8px 0;

  border-top:
    1px solid #eeeaf5;

  font-size: 14px;
}

.person button {

  padding: 7px 11px;

  font-size: 13px;
}

.search-box {

  display: flex;

  gap: 8px;
}

.search-box input {
  flex: 1;

  font-size: 22px;

  letter-spacing: 4px;

  text-align: center;
}

.result {
  margin-top: 15px;
}

.message {

  padding: 12px;

  border-radius: 10px;

  background: #f1eff8;

  color: #555d73;

  margin-bottom: 15px;
}

.error {

  background: #ffe4e4;

  color: #a12626;
}

.loading {

  color: #747b91;

  font-size: 14px;
}

.hidden {
  display: none !important;
}

@media(max-width: 500px) {

  .row {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 27px;
  }

  .app {
    width: 94%;
  }
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div
      id="userBadge"
      class="user-badge"
    >
      CARICAMENTO
    </div>

    <h1>
      Ingressi festa
    </h1>

    <div class="subtitle">
      Posti ancora liberi:
      <strong id="free">
        ...
      </strong>
    </div>

  </div>


  <!-- ======================================================
       ADMIN
       ====================================================== -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <div class="card">

      <h2>
        Ingresso
      </h2>

      <p class="loading">
        Inserisci il codice a 4 cifre dell'invitato.
      </p>

      <div class="search-box">

        <input
          id="searchCode"
          maxlength="4"
          inputmode="numeric"
          placeholder="0000"
        >

        <button
          onclick="searchBooking()"
        >
          CERCA
        </button>

      </div>

      <div
        id="searchResult"
        class="result"
      ></div>

    </div>


    <div class="card">

      <h2>
        Prenotazioni
      </h2>

      <div
        id="adminList"
      >
        <div class="loading">
          Caricamento...
        </div>
      </div>

    </div>

  </div>


  <!-- ======================================================
       ORGANIZZATORE
       ====================================================== -->

  <div
    id="organizerPanel"
    class="hidden"
  >

    <div class="card">

      <div class="row">

        <div>

          <label>
            Nome di chi prenota
          </label>

          <input
            id="bookingName"
            placeholder="Paolo Rossi"
          >

        </div>

        <div>

          <label>
            Telefono
          </label>

          <input
            id="bookingPhone"
            placeholder="3331234567"
            inputmode="tel"
          >

        </div>

      </div>


      <br>


      <label>
        Numero persone
      </label>

      <input
        id="bookingPeople"
        type="number"
        min="1"
        max="50"
        value="1"
      >


      <br>


      <label>
        Pagamento
      </label>

      <div class="payment-row">

        <button
          id="paidBtn"
          class="secondary"
          onclick="setPayment(true)"
        >
          ✓ PAGATO
        </button>

        <button
          id="unpaidBtn"
          class="secondary active"
          onclick="setPayment(false)"
        >
          DA PAGARE
        </button>

      </div>


      <div
        id="amountContainer"
        class="amount"
      >

        <label>
          Importo pagato (€)
        </label>

        <input
          id="amount"
          type="number"
          min="0"
          step="0.01"
          value="25"
        >

      </div>


      <br>


      <button
        class="full"
        onclick="createBooking()"
        id="createButton"
      >
        CREA PRENOTAZIONE
      </button>

    </div>


    <div class="card">

      <h2>
        Le mie prenotazioni
      </h2>

      <div
        id="bookingList"
      >
        <div class="loading">
          Caricamento...
        </div>
      </div>

    </div>

  </div>


  <div
    id="globalMessage"
    class="hidden"
  ></div>

</div>


<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================

   IMPORTANTE:
   metti qui lo STESSO URL /exec che usavi nel vecchio HTML.

   Esempio:
   https://script.google.com/macros/s/XXXXXXXX/exec
   ============================================================ */

const API_URL =
  'INCOLLA_QUI_IL_TUO_URL_APPS_SCRIPT_EXEC';


/* ============================================================
   STATO
   ============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );

const KEY =
  params.get('k') || '';

let user = null;

let bookings = [];

let paymentSelected = false;


/* ============================================================
   API
   ============================================================ */

async function api(action, data = {}) {

  const body = {

    action,

    key: KEY,

    rid:
      Date.now().toString() +
      Math.random()
        .toString(36)
        .slice(2)

  };


  Object.assign(body, data);


  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(body)
      }
    );


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  } catch (e) {

    throw new Error(
      'Risposta non valida da Google.'
    );
  }


  if (!result.ok) {

    throw new Error(
      result.error ||
      'Errore'
    );
  }


  return result;
}


/* ============================================================
   INIT
   ============================================================

   La pagina NON aspetta questa funzione per essere mostrata.
   Questo è fondamentale per evitare l'effetto dei 30 secondi.
   ============================================================ */

async function init() {

  try {

    const result =
      await api('init');


    user = result;


    setupUser();


    updateFree(
      result.free
    );


    bookings =
      result.list || [];


    if (user.role === 'admin') {

      renderAdmin();

    } else {

      renderOrganizer();
    }


  } catch (err) {

    showError(
      err.message
    );

  }

}


/* ============================================================
   USER
   ============================================================ */

function setupUser() {

  const badge =
    document.getElementById(
      'userBadge'
    );


  badge.textContent =
    user.name.toUpperCase();


  badge.className =
    'user-badge ' +
    (
      user.role === 'admin'
        ? 'admin'
        : user.name.toLowerCase()
    );


  if (user.role === 'admin') {

    document
      .getElementById(
        'adminPanel'
      )
      .classList.remove(
        'hidden'
      );

  } else {

    document
      .getElementById(
        'organizerPanel'
      )
      .classList.remove(
        'hidden'
      );
  }

}


/* ============================================================
   FREE
   ============================================================ */

function updateFree(n) {

  document
    .getElementById('free')
    .textContent =
      n;
}


/* ============================================================
   PAYMENT
   ============================================================ */

function setPayment(value) {

  paymentSelected =
    value;


  const paidBtn =
    document.getElementById(
      'paidBtn'
    );

  const unpaidBtn =
    document.getElementById(
      'unpaidBtn'
    );

  const amount =
    document.getElementById(
      'amountContainer'
    );


  paidBtn.classList.toggle(
    'active',
    value
  );


  unpaidBtn.classList.toggle(
    'active',
    !value
  );


  amount.classList.toggle(
    'show',
    value
  );


  if (value) {

    const people =
      Number(
        document.getElementById(
          'bookingPeople'
        ).value
      ) || 1;


    document
      .getElementById(
        'amount'
      )
      .value =
        people *
        (user.ticketPrice || 25);
  }

}


/* ============================================================
   CREATE
   ============================================================ */

async function createBooking() {

  const name =
    document
      .getElementById(
        'bookingName'
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        'bookingPhone'
      )
      .value
      .trim();


  const people =
    Number(
      document
        .getElementById(
          'bookingPeople'
        )
        .value
    );


  if (!name) {

    showError(
      'Inserisci il nome.'
    );

    return;
  }


  if (!phone) {

    showError(
      'Inserisci il telefono.'
    );

    return;
  }


  if (
    !people ||
    people < 1 ||
    people > 50
  ) {

    showError(
      'Numero persone non valido.'
    );

    return;
  }


  const names = [];

  for (
    let i = 0;
    i < people;
    i++
  ) {

    if (i === 0) {

      names.push(name);

    } else {

      names.push(
        name +
        ' - Persona ' +
        (i + 1)
      );

    }
  }


  let amount = 0;


  if (paymentSelected) {

    amount =
      Number(
        document
          .getElementById(
            'amount'
          )
          .value
      ) || 0;
  }


  const button =
    document.getElementById(
      'createButton'
    );


  button.disabled = true;

  button.textContent =
    'SALVATAGGIO...';


  try {

    const result =
      await api(
        'create',
        {
          names,
          phone,
          paid:
            paymentSelected,
          amount
        }
      );


    /*
     * Aggiorniamo subito la UI.
     * Non aspettiamo una seconda richiesta.
     */

    bookings.unshift({

      code:
        result.code,

      name:
        result.name,

      phone:
        result.phone,

      paid:
        result.paid,

      amount:
        result.amount,

      cancelled:
        false,

      by:
        user.name,

      att:
        names.map(
          (n, i) => ({
            n,
            e: false,
            k: i + 1
          })
        )
    });


    updateFree(
      result.free
    );


    renderOrganizer();


    document
      .getElementById(
        'bookingName'
      )
      .value = '';


    document
      .getElementById(
        'bookingPhone'
      )
      .value = '';


    document
      .getElementById(
        'bookingPeople'
      )
      .value = '1';


    setPayment(false);


    showMessage(
      'Prenotazione creata. Codice: ' +
      result.code
    );


  } catch (err) {

    showError(
      err.message
    );

  } finally {

    button.disabled = false;

    button.textContent =
      'CREA PRENOTAZIONE';
  }

}


/* ============================================================
   ORGANIZER LIST
   ============================================================ */

function renderOrganizer() {

  const box =
    document.getElementById(
      'bookingList'
    );


  if (!bookings.length) {

    box.innerHTML =
      '<div class="loading">' +
      'Nessuna prenotazione.' +
      '</div>';

    return;
  }


  box.innerHTML =
    bookings
      .map(
        bookingHTML
      )
      .join('');
}


/* ============================================================
   BOOKING HTML
   ============================================================ */

function bookingHTML(g) {

  const paid =
    g.paid === true;


  const cancelled =
    g.cancelled === true;


  const people =
    g.att
      ? g.att.length
      : 0;


  const entered =
    g.att
      ? g.att.filter(
          a => a.e
        ).length
      : 0;


  return `

    <div class="booking ${
      cancelled
        ? 'cancelled'
        : ''
    }">

      <div class="booking-name">
        ${escapeHtml(g.name)}
      </div>

      <div class="booking-info">

        ${escapeHtml(g.phone)}
        ·
        ${people}
        ${people === 1
          ? 'persona'
          : 'persone'}

      </div>

      <div>

        Codice

        <span class="code">
          ${escapeHtml(g.code)}
        </span>

        <span class="status ${
          paid
            ? 'paid'
            : 'unpaid'
        }">

          ${
            paid
              ? 'PAGATO €' +
                Number(
                  g.amount || 0
                ).toFixed(2)
              : 'DA PAGARE'
          }

        </span>

      </div>

      ${
        entered > 0
          ? `
            <div
              class="status entered"
              style="margin-top:8px"
            >
              Entrati:
              ${entered}/${people}
            </div>
          `
          : ''
      }

      ${
        g.att
          ? g.att
              .map(
                p => `
                  <div class="person">

                    <span>
                      ${escapeHtml(p.n)}

                      ${
                        p.e
                          ? ' ✓'
                          : ''
                      }
                    </span>

                  </div>
                `
              )
              .join('')
          : ''
      }

    </div>
  `;
}


/* ============================================================
   ADMIN SEARCH
   ============================================================ */

async function searchBooking() {

  const code =
    document
      .getElementById(
        'searchCode'
      )
      .value
      .trim();


  if (
    !/^\d{4}$/.test(code)
  ) {

    showSearchError(
      'Inserisci un codice di 4 cifre.'
    );

    return;
  }


  try {

    const result =
      await api(
        'scan',
        { code }
      );


    const box =
      document.getElementById(
        'searchResult'
      );


    if (
      result.status ===
      'invalid'
    ) {

      box.innerHTML =
        '<div class="message error">' +
        'Codice non trovato.' +
        '</div>';

      return;
    }


    if (
      result.status ===
      'cancelled'
    ) {

      box.innerHTML =
        '<div class="message error">' +
        'Questa prenotazione è annullata.' +
        '</div>';

      return;
    }


    const g =
      result.b;


    if (
      result.status ===
      'used'
    ) {

      box.innerHTML =
        bookingAdminHTML(
          g,
          true
        );

      return;
    }


    box.innerHTML =
      bookingAdminHTML(
        g,
        false
      );


  } catch (err) {

    showSearchError(
      err.message
    );
  }

}


/* ============================================================
   ADMIN BOOKING
   ============================================================ */

function bookingAdminHTML(
  g,
  used
) {

  return `

    <div class="booking">

      <div class="booking-name">
        ${escapeHtml(g.name)}
      </div>

      <div class="booking-info">

        ${escapeHtml(g.phone)}
        ·
        ${g.att.length}
        ${
          g.att.length === 1
            ? 'persona'
            : 'persone'
        }

      </div>

      <div>

        Codice

        <span class="code">
          ${escapeHtml(g.code)}
        </span>

      </div>

      <br>

      <div>

        Pagamento:

        <span class="status ${
          g.paid
            ? 'paid'
            : 'unpaid'
        }">

          ${
            g.paid
              ? 'PAGATO €' +
                Number(
                  g.amount || 0
                ).toFixed(2)
              : 'DA PAGARE'
          }

        </span>

      </div>

      <br>

      ${
        g.att
          .map(
            p => `
              <div class="person">

                <span>
                  ${escapeHtml(p.n)}

                  ${
                    p.e
                      ? ' ✓ ENTRATO'
                      : ''
                  }
                </span>

              </div>
            `
          )
          .join('')
      }

      <br>

      ${
        used

          ? `

            <div class="message">
              Tutte le persone sono già entrate.
            </div>

          `

          : `

            <button
              class="green full"
              onclick="admitAll('${escapeHtml(g.code)}')"
            >
              FAI ENTRARE TUTTI
            </button>

          `
      }

      <br><br>

      <button
        class="secondary full"
        onclick="adminPayment(
          '${escapeHtml(g.code)}',
          ${g.paid},
          ${Number(g.amount || 0)}
        )"
      >
        MODIFICA PAGAMENTO
      </button>

    </div>

  `;
}


/* ============================================================
   ADMIT
   ============================================================ */

async function admitAll(code) {

  try {

    const result =
      await api(
        'scan',
        { code }
      );


    const g =
      result.b;


    const indexes =
      g.att
        .filter(
          a => !a.e
        )
        .map(
          a => a.k
        );


    if (!indexes.length) {

      showSearchError(
        'Tutti sono già entrati.'
      );

      return;
    }


    await api(
      'admit',
      {
        code,
        idx: indexes
      }
    );


    await searchBooking();


  } catch (err) {

    showSearchError(
      err.message
    );
  }

}


/* ============================================================
   PAYMENT ADMIN
   ============================================================ */

async function adminPayment(
  code,
  currentPaid,
  currentAmount
) {

  const paid =
    confirm(
      'Premi OK se la prenotazione è PAGATA.\n\n' +
      'Premi Annulla per impostarla come DA PAGARE.'
    );


  let amount = 0;


  if (paid) {

    const input =
      prompt(
        'Importo pagato:',
        currentAmount ||
        '25'
      );


    if (input === null) {
      return;
    }


    amount =
      Number(input);


    if (
      !isFinite(amount) ||
      amount < 0
    ) {

      showSearchError(
        'Importo non valido.'
      );

      return;
    }
  }


  try {

    await api(
      'paid',
      {
        code,
        value: paid,
        amount
      }
    );


    await searchBooking();


  } catch (err) {

    showSearchError(
      err.message
    );
  }

}


/* ============================================================
   ADMIN LIST
   ============================================================ */

function renderAdmin() {

  const box =
    document.getElementById(
      'adminList'
    );


  if (!bookings.length) {

    box.innerHTML =
      '<div class="loading">' +
      'Nessuna prenotazione.' +
      '</div>';

    return;
  }


  box.innerHTML =
    bookings
      .map(
        bookingHTML
      )
      .join('');
}


/* ============================================================
   MESSAGGI
   ============================================================ */

function showMessage(text) {

  const box =
    document.getElementById(
      'globalMessage'
    );


  box.className =
    'message';


  box.textContent =
    text;


  setTimeout(
    () => {
      box.className =
        'hidden';
    },
    4000
  );
}


function showError(text) {

  const box =
    document.getElementById(
      'globalMessage'
    );


  box.className =
    'message error';


  box.textContent =
    text;
}


function showSearchError(text) {

  const box =
    document.getElementById(
      'searchResult'
    );


  box.innerHTML =
    `
      <div class="message error">
        ${escapeHtml(text)}
      </div>
    `;
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


/* ============================================================
   AVVIO
   ============================================================

   ATTENZIONE:
   init() parte DOPO che il browser ha già mostrato la pagina.
   ============================================================ */

window.addEventListener(
  'DOMContentLoaded',
  () => {

    init();

  }
);

</script>
