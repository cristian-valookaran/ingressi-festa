<!doctype html>

<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Ingressi festa</title>


<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap"
  rel="stylesheet"
>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>


<style>

:root{
  --bg:#F6F3FF;
  --card:#fff;
  --ink:#1E1B3A;
  --mut:#6B6890;
  --line:#DDD8F2;
  --acc:#D62D6A;
  --onacc:#fff;
  --ok:#0F7A55;
  --okbg:#D6F4E6;
  --bad:#B3243A;
  --badbg:#FCDDE2;

  box-sizing:border-box;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}


@media (prefers-color-scheme:dark){

  :root:not([data-theme="light"]){

    --bg:#15132B;
    --card:#211E42;
    --ink:#F2EFFF;
    --mut:#A9A5CF;
    --line:#38346A;
    --acc:#FF5C8A;
    --onacc:#1B0A12;
    --ok:#5EE0A8;
    --okbg:#0F3A2B;
    --bad:#FF8A9B;
    --badbg:#4A1622
  }
}


:root[data-theme="dark"]{

  --bg:#15132B;
  --card:#211E42;
  --ink:#F2EFFF;
  --mut:#A9A5CF;
  --line:#38346A;
  --acc:#FF5C8A;
  --onacc:#1B0A12;
  --ok:#5EE0A8;
  --okbg:#0F3A2B;
  --bad:#FF8A9B;
  --badbg:#4A1622
}


html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}


*,
*::before,
*::after{
  box-sizing:inherit
}


body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif
}


main{
  max-width:560px;
  margin:0 auto;
  padding:18px 16px 40px
}


h1{
  font:800 30px/1.1 "Bricolage Grotesque",system-ui,sans-serif;
  margin:0 0 6px
}


.stats{
  color:var(--mut);
  font-size:14px;
  margin-bottom:16px
}


.stats b{
  color:var(--ink)
}


nav{
  display:flex;
  gap:6px;
  margin-bottom:16px
}


nav button{
  flex:1;
  padding:12px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:12px;
  font:600 15px system-ui
}


nav button.on{
  background:var(--acc);
  color:var(--onacc);
  border-color:var(--acc)
}


.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px
}


label{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin:8px 0 4px
}


input{
  width:100%;
  padding:12px;
  font:inherit;
  background:var(--bg);
  color:var(--ink);
  border:1.5px solid var(--line);
  border-radius:10px
}


input:focus,
button:focus-visible{
  outline:3px solid var(--acc);
  outline-offset:1px
}


.row{
  display:flex;
  gap:8px
}


.row>*{
  flex:1
}


.btn{
  padding:12px 16px;
  border:0;
  border-radius:12px;
  background:var(--acc);
  color:var(--onacc);
  font:700 16px system-ui;
  cursor:pointer
}


.btn.g{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--line)
}


.btn.s{
  padding:8px 12px;
  font-size:14px
}


.btn.full{
  width:100%;
  margin-top:12px
}


.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}


.msg{
  min-height:20px;
  margin-top:8px;
  font-size:14px;
  color:var(--bad)
}


.it{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 10px;
  padding:12px 0;
  border-top:1px solid var(--line)
}


.it:first-child{
  border-top:0
}


.who{
  flex:1 1 60%;
  min-width:0
}


.who b{
  display:block
}


.who span{
  font-size:13px;
  color:var(--mut)
}


.pp{
  font:800 18px "Bricolage Grotesque",system-ui,sans-serif;
  min-width:44px;
  text-align:right
}


.acts{
  display:flex;
  gap:6px;
  width:100%
}


.it.off{
  opacity:.5
}


.it.off .who b{
  text-decoration:line-through
}


.done{
  color:var(--ok)
}


/* CAMERA */

#vid{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#000;
  border-radius:16px;
  display:block
}


.cameraBox{
  position:relative;
  overflow:hidden;
  border-radius:16px;
  background:#000
}


.cameraOverlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center
}


.cameraFrame{
  width:65%;
  aspect-ratio:1;
  border:3px solid #fff;
  border-radius:20px;
  box-shadow:
    0 0 0 999px rgba(0,0,0,.20)
}


.res{
  border-radius:16px;
  padding:20px;
  margin-top:14px;
  text-align:center
}


.res.ok{
  background:var(--okbg);
  color:var(--ok)
}


.res.bad{
  background:var(--badbg);
  color:var(--bad)
}


.res h2{
  margin:0 0 8px;
  font:800 28px/1.1 "Bricolage Grotesque",system-ui,sans-serif
}


.res p{
  margin:4px 0;
  color:var(--ink)
}


.ov{
  position:fixed;
  inset:0;
  background:rgba(10,8,30,.7);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:9
}


.ov.on{
  display:flex
}


.pop{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  max-width:420px;
  width:100%;
  max-height:100%;
  overflow:auto;
  text-align:center
}


.pop img{
  width:100%;
  border-radius:10px;
  background:#fff
}


.hint{
  font-size:13px;
  color:var(--mut);
  margin:8px 0
}


.scanStatus{
  text-align:center;
  font-weight:700;
  margin:10px 0;
  color:var(--mut)
}


[hidden]{
  display:none!important
}

</style>

</head>


<body>

<main>

<h1>Ingressi festa</h1>

<div class="stats" id="stats">
  Caricamento…
</div>

<div class="msg" id="top"></div>


<nav id="nav" hidden>

  <button
    data-tab="list"
    class="on"
  >
    Prenotazioni
  </button>

  <button
    data-tab="scan"
  >
    Scanner
  </button>

</nav>


<!-- =====================================================
     PRENOTAZIONI
     ===================================================== -->

<section id="list" hidden>

  <div class="box">

    <label for="nm">
      Nome di chi prenota (persona 1)
    </label>

    <input
      id="nm"
      placeholder="Paolo Rossi"
      autocomplete="name"
    >


    <div class="row">

      <div>

        <label for="ph">
          Telefono
        </label>

        <input
          id="ph"
          type="tel"
          inputmode="tel"
          placeholder="333 1234567"
          autocomplete="tel"
        >

      </div>


      <div>

        <label for="pe">
          Persone
        </label>

        <input
          id="pe"
          type="number"
          min="1"
          max="50"
          value="1"
          inputmode="numeric"
        >

      </div>

    </div>


    <div id="names"></div>


    <button
      class="btn full"
      id="add"
    >
      Crea prenotazione e QR
    </button>


    <div
      class="msg"
      id="fmsg"
    ></div>

  </div>


  <input
    id="q"
    type="search"
    placeholder="Cerca per nome, telefono o codice"
    hidden
  >


  <div
    class="box"
    id="items"
    style="margin-top:12px"
  ></div>

</section>


<!-- =====================================================
     SCANNER
     ===================================================== -->

<section id="scan" hidden>

  <div class="cameraBox">

    <video
      id="vid"
      playsinline
      muted
      autoplay
    ></video>

    <div class="cameraOverlay">
      <div class="cameraFrame"></div>
    </div>

  </div>


  <div
    class="scanStatus"
    id="cam"
  >
    Preparazione scanner…
  </div>


  <label
    class="btn g s"
    style="display:block;text-align:center;margin:0"
  >

    📷 Scatta foto del QR

    <input
      id="pic"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    >

  </label>


  <div
    class="row"
    style="margin-top:10px"
  >

    <input
      id="man"
      placeholder="Oppure scrivi il codice (BDAY-…)"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button
      class="btn s"
      id="manGo"
      style="flex:0 0 auto"
    >
      Verifica
    </button>

  </div>


  <div id="res"></div>

</section>

</main>


<!-- =====================================================
     QR MODAL
     ===================================================== -->

<div
  class="ov"
  id="ov"
>

  <div class="pop">

    <img
      id="qimg"
      alt="QR della prenotazione"
    >

    <p class="hint">
      Tieni premuto sull'immagine per salvarla
      o inviarla su WhatsApp.
    </p>


    <div class="row">

      <button
        class="btn s"
        id="share"
      >
        Condividi
      </button>

      <button
        class="btn g s"
        id="close"
      >
        Chiudi
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API =
  'https://script.google.com/macros/s/AKfycbxO-R2yW13gYo4jHB-rls7jxcv-GDUsv8jsaFsWVwkTLRmrkc4RRERwDSSPU8HUMLov/exec';


let K = null;

let ME = null;

let L = [];

let FREE = 0;

let USED = 0;

let CAP = 180;

let cur = null;


/* =========================================================
   HELPERS
   ========================================================= */

const $ =
  id =>
    document.getElementById(id);


const esc =
  s =>
    String(s)
      .replace(
        /[&<>"']/g,
        c =>
          ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[c])
      );


/* =========================================================
   RECUPERO CHIAVE
   ========================================================= */

(function(){

  const p =
    new URLSearchParams(
      location.search
    ).get('k');


  if (p) {

    try {

      localStorage.setItem(
        'k',
        p
      );

    } catch(e){}


    /*
      Nasconde la chiave dalla barra
      del browser dopo il primo accesso.
    */

    try {

      history.replaceState(
        null,
        '',
        location.pathname
      );

    } catch(e){}
  }


  try {

    K =
      p ||
      localStorage.getItem('k');

  } catch(e) {

    K = p;
  }

})();


/* =========================================================
   API
   ========================================================= */

async function api(action, d){

  let r;

  let t;

  let j;


  try {

    r =
      await fetch(
        API,
        {
          method:'POST',

          headers:{
            'Content-Type':'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              Object.assign(
                {
                  key:K,
                  action:action
                },
                d || {}
              )
            )
        }
      );


    t =
      await r.text();

  } catch(e) {

    throw new Error(
      'Nessuna connessione a Google (' +
      e.message +
      '). Controlla la distribuzione dello script.'
    );
  }


  try {

    j =
      JSON.parse(t);

  } catch(e) {

    throw new Error(
      'Risposta non valida da Google (codice ' +
      r.status +
      '): ' +
      t
        .replace(/<[^>]*>/g,' ')
        .replace(/\s+/g,' ')
        .trim()
        .slice(0,200)
    );
  }


  if (!j.ok) {

    throw new Error(
      j.error ||
      'Errore'
    );
  }


  return j;
}


/* =========================================================
   REFRESH
   ========================================================= */

async function refresh(){

  const j =
    await api('list');


  L =
    j.list;


  FREE =
    j.free;


  USED =
    j.used;


  render();
}


/* =========================================================
   INIT
   ========================================================= */

async function init(){

  if (!K) {

    $('stats').textContent = '';

    $('top').textContent =
      'Link non valido. Chiedi il link giusto a chi organizza.';

    return;
  }


  try {

    const j =
      await api('whoami');


    ME =
      j;


    CAP =
      j.capacity;


    $('list').hidden = false;


    /*
      SOLO ADMIN:
      mostra tab scanner e ricerca.
    */

    if (
      j.role === 'admin'
    ) {

      $('nav').hidden = false;

      $('q').hidden = false;

    }


    await refresh();


  } catch(e) {

    $('stats').textContent = '';

    $('top').textContent =
      e.message;
  }
}


/* =========================================================
   RENDER LISTA
   ========================================================= */

function render(){

  if (!ME) {
    return;
  }


  const admin =
    ME.role === 'admin';


  const q =
    admin
      ? $('q').value
          .trim()
          .toLowerCase()
      : '';


  const ent =
    L
      .filter(
        b => !b.cancelled
      )
      .reduce(
        (t,b) =>
          t +
          b.att.filter(
            a => a.e
          ).length,
        0
      );


  $('stats').innerHTML =
    admin

      ? `Prenotati <b>${USED}</b> su ${CAP}
         · Entrati <b>${ent}</b>
         · Liberi <b>${FREE}</b>`

      : `Posti ancora liberi:
         <b>${FREE}</b>`;


  const R =
    L
      .filter(
        b =>
          !q ||
          (
            b.name +
            ' ' +
            b.phone +
            ' ' +
            b.code +
            ' ' +
            b.att
              .map(a => a.n)
              .join(' ')
          )
          .toLowerCase()
          .includes(q)
      )
      .slice()
      .reverse();


  $('items').innerHTML =
    R.length

      ? R.map(b => {

          const n =
            b.att.length;


          const e =
            b.att.filter(
              a => a.e
            ).length;


          return `

          <div class="it ${b.cancelled ? 'off' : ''}">

            <div class="who">

              <b>
                ${esc(
                  b.name ||
                  b.phone
                )}
              </b>

              <span>

                ${esc(b.phone)}
                ·
                ${n}
                ${n === 1 ? 'persona' : 'persone'}

                ${
                  admin
                    ? (
                        b.paid
                          ? ' · pagato'
                          : ' · da pagare'
                      )
                    : ''
                }

                ${
                  n > 1
                    ? '<br>' +
                      esc(
                        b.att
                          .map(
                            a =>
                              (
                                a.e
                                  ? '✓ '
                                  : ''
                              ) +
                              (
                                a.n ||
                                'senza nome'
                              )
                          )
                          .join(', ')
                      )
                    : ''
                }

              </span>

            </div>


            ${
              admin

                ? `
                  <div
                    class="pp ${
                      e >= n &&
                      !b.cancelled
                        ? 'done'
                        : ''
                    }"
                  >
                    ${e}/${n}
                  </div>
                `

                : ''
            }


            <div class="acts">

              <button
                class="btn s"
                data-a="qr"
                data-c="${b.code}"
                ${b.cancelled ? 'hidden' : ''}
              >
                QR
              </button>


              ${
                admin

                  ? `

                    <button
                      class="btn g s"
                      data-a="paid"
                      data-c="${b.code}"
                    >
                      ${
                        b.paid
                          ? 'Segna non pagato'
                          : 'Segna pagato'
                      }
                    </button>


                    <button
                      class="btn g s"
                      data-a="tog"
                      data-c="${b.code}"
                    >
                      ${
                        b.cancelled
                          ? 'Ripristina'
                          : 'Annulla'
                      }
                    </button>

                  `

                  : ''
              }

            </div>

          </div>

          `;

        }).join('')

      : `
        <p
          class="hint"
          style="margin:0"
        >
          Nessuna prenotazione.
        </p>
      `;
}


$('q').oninput =
  render;


/* =========================================================
   NOMI PERSONE
   ========================================================= */

function renderNames(){

  const n =
    Math.max(
      1,
      Math.min(
        50,
        parseInt(
          $('pe').value,
          10
        ) || 1
      )
    );


  const old =
    [
      ...document.querySelectorAll('.nx')
    ]
      .map(
        i => i.value
      );


  $('names').innerHTML =
    Array
      .from(
        {
          length:n - 1
        },
        (_,i) =>
          `
          <label>
            Persona ${i + 2}
          </label>

          <input
            class="nx"
            placeholder="Nome"
            value="${esc(
              old[i] || ''
            )}"
          >
          `
      )
      .join('');
}


$('pe').oninput =
  renderNames;


/* =========================================================
   CREA PRENOTAZIONE
   ========================================================= */

$('add').onclick =
  async () => {

    const m =
      $('fmsg');


    const btn =
      $('add');


    const n =
      Math.max(
        1,
        Math.min(
          50,
          parseInt(
            $('pe').value,
            10
          ) || 1
        )
      );


    const names =
      [
        $('nm').value.trim(),

        ...[
          ...document.querySelectorAll('.nx')
        ]
          .map(
            i => i.value.trim()
          )
      ]
      .slice(0,n);


    while (
      names.length < n
    ) {

      names.push('');
    }


    btn.disabled = true;

    btn.textContent =
      'Salvataggio…';


    m.textContent = '';


    try {

      const j =
        await api(
          'create',
          {
            phone:
              $('ph').value,

            names:
              names
          }
        );


      $('nm').value = '';

      $('ph').value = '';

      $('pe').value = 1;

      renderNames();


      await refresh();


      showQR({
        code:j.code,
        label:
          names[0] ||
          'Prenotazione',
        n:n
      });


    } catch(e) {

      m.textContent =
        e.message;

    }


    btn.disabled = false;

    btn.textContent =
      'Crea prenotazione e QR';
  };


/* =========================================================
   CLICK LISTA
   ========================================================= */

$('items').onclick =
  async e => {

    const t =
      e.target.closest('button');


    if (!t) {
      return;
    }


    const b =
      L.find(
        x =>
          x.code ===
          t.dataset.c
      );


    if (!b) {
      return;
    }


    if (
      t.dataset.a === 'qr'
    ) {

      showQR({
        code:b.code,
        label:
          b.name ||
          b.phone,
        n:
          b.att.length
      });

      return;
    }


    t.disabled = true;


    try {

      await api(
        t.dataset.a === 'paid'
          ? 'paid'
          : 'cancel',

        {
          code:b.code,

          value:
            t.dataset.a === 'paid'
              ? !b.paid
              : !b.cancelled
        }
      );


      await refresh();


    } catch(err) {

      $('fmsg').textContent =
        err.message;


      t.disabled = false;
    }
  };


/* =========================================================
   GENERAZIONE QR
   ========================================================= */

function qrCanvas(b){

  const q =
    qrcode(
      0,
      'M'
    );


  q.addData(
    b.code
  );


  q.make();


  const n =
    q.getModuleCount();


  const m = 4;


  const cell =
    Math.floor(
      600 /
      (n + 2 * m)
    );


  const sz =
    cell *
    (n + 2 * m);


  const W = 720;

  const H =
    sz + 230;


  const oy = 30;

  const ox =
    (W - sz) / 2;


  const c =
    document.createElement(
      'canvas'
    );


  c.width = W;

  c.height = H;


  const x =
    c.getContext('2d');


  x.fillStyle =
    '#fff';

  x.fillRect(
    0,
    0,
    W,
    H
  );


  x.fillStyle =
    '#000';


  for (
    let r = 0;
    r < n;
    r++
  ) {

    for (
      let k = 0;
      k < n;
      k++
    ) {

      if (
        q.isDark(
          r,
          k
        )
      ) {

        x.fillRect(
          ox +
            (m + k) *
            cell,

          oy +
            (m + r) *
            cell,

          cell,
          cell
        );
      }
    }
  }


  x.fillStyle =
    '#1E1B3A';


  x.textAlign =
    'center';


  x.font =
    '700 44px system-ui,sans-serif';


  x.fillText(
    String(
      b.label
    ).slice(0,26),

    W / 2,

    oy +
      sz +
      60
  );


  x.font =
    '32px system-ui,sans-serif';


  x.fillText(
    b.n +
      (
        b.n == 1
          ? ' persona'
          : ' persone'
      ),

    W / 2,

    oy +
      sz +
      112
  );


  x.font =
    '28px monospace';


  x.fillText(
    b.code,

    W / 2,

    oy +
      sz +
      164
  );


  return c;
}


/* =========================================================
   MOSTRA QR
   ========================================================= */

function showQR(b){

  cur = b;


  $('qimg').src =
    qrCanvas(b)
      .toDataURL(
        'image/png'
      );


  $('ov')
    .classList
    .add('on');
}


$('close').onclick =
  () =>
    $('ov')
      .classList
      .remove('on');


/* =========================================================
   CONDIVIDI QR
   ========================================================= */

$('share').onclick =
  () => {

    qrCanvas(cur)
      .toBlob(
        async bl => {

          try {

            const f =
              new File(
                [bl],
                cur.code +
                  '.png',
                {
                  type:
                    'image/png'
                }
              );


            if (
              navigator.canShare &&
              navigator.canShare({
                files:[f]
              })
            ) {

              await navigator.share({

                files:[f],

                text:
                  'Ecco il tuo QR per entrare alla festa. Mostralo all\'ingresso.'
              });

            } else {

              alert(
                'Su questo telefono tieni premuto sull\'immagine per salvarla o inviarla.'
              );
            }


          } catch(e) {}

        }
      );
  };


/* =========================================================
   SCANNER QR - SOLO ADMIN
   ========================================================= */

let stream = null;

let scanning = false;

let hold = false;


const v =
  $('vid');


const cv =
  document.createElement(
    'canvas'
  );


const cx =
  cv.getContext(
    '2d',
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   AVVIO SCANNER
   ========================================================= */

async function startScan(){

  if (scanning) {
    return;
  }


  /*
    Controllo browser.
  */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    $('cam').textContent =
      '❌ La fotocamera non è disponibile in questo browser. Usa "Scatta foto del QR" oppure inserisci il codice manualmente.';

    return;
  }


  /*
    Controllo jsQR.
  */

  if (
    typeof jsQR !== 'function'
  ) {

    $('cam').textContent =
      '❌ Scanner QR non caricato. Controlla la connessione e ricarica la pagina.';

    return;
  }


  try {

    $('cam').textContent =
      '📷 Richiesta accesso alla fotocamera…';


    /*
      Prima proviamo la fotocamera posteriore.
    */

    try {

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{

              facingMode:{
                ideal:'environment'
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:720
              }
            },

            audio:false
          });


    } catch(firstError) {

      /*
        Fallback:
        se environment non viene accettato,
        proviamo una qualsiasi videocamera.
      */

      console.warn(
        'Fotocamera posteriore non disponibile:',
        firstError
      );


      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:true,

            audio:false
          });
    }


    /*
      Colleghiamo la camera al video.
    */

    v.srcObject =
      stream;


    v.setAttribute(
      'playsinline',
      ''
    );


    v.setAttribute(
      'autoplay',
      ''
    );


    v.muted = true;


    /*
      play() esplicito:
      importante su alcuni telefoni.
    */

    await v.play();


    scanning = true;

    hold = false;


    $('cam').textContent =
      '📷 Inquadra il QR del biglietto.';


    requestAnimationFrame(
      tick
    );


  } catch(e) {

    console.error(
      'Camera error:',
      e
    );


    scanning = false;


    let msg =
      '❌ Impossibile accedere alla fotocamera. ';


    if (
      e.name ===
      'NotAllowedError'
    ) {

      msg +=
        'Devi consentire l’accesso alla fotocamera nel browser.';

    } else if (
      e.name ===
      'NotFoundError'
    ) {

      msg +=
        'Nessuna fotocamera trovata.';

    } else if (
      e.name ===
      'NotReadableError'
    ) {

      msg +=
        'La fotocamera è già utilizzata da un’altra applicazione.';

    } else if (
      e.name ===
      'SecurityError'
    ) {

      msg +=
        'Il browser ha bloccato l’accesso alla fotocamera.';

    } else {

      msg +=
        'Puoi usare "Scatta foto del QR" oppure inserire il codice manualmente.';
    }


    $('cam').textContent =
      msg;
  }
}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopScan(){

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => {

          try {
            track.stop();
          } catch(e) {}

        }
      );


    stream = null;
  }


  v.srcObject =
    null;
}


/* =========================================================
   LOOP SCANNER
   ========================================================= */

function tick(){

  if (!scanning) {
    return;
  }


  if (
    !hold &&
    v.readyState >=
      v.HAVE_ENOUGH_DATA &&
    v.videoWidth > 0 &&
    v.videoHeight > 0
  ) {


    /*
      Riduciamo la risoluzione
      per non sovraccaricare il telefono.
    */

    const maxWidth =
      900;


    const scale =
      Math.min(
        1,
        maxWidth /
          v.videoWidth
      );


    cv.width =
      Math.round(
        v.videoWidth *
        scale
      );


    cv.height =
      Math.round(
        v.videoHeight *
        scale
      );


    cx.drawImage(
      v,
      0,
      0,
      cv.width,
      cv.height
    );


    try {

      const image =
        cx.getImageData(
          0,
          0,
          cv.width,
          cv.height
        );


      const result =
        jsQR(
          image.data,
          image.width,
          image.height,
          {
            inversionAttempts:
              'attemptBoth'
          }
        );


      if (
        result &&
        result.data
      ) {

        hold = true;


        handle(
          result.data
        );
      }


    } catch(e) {

      console.error(
        'QR scan error:',
        e
      );
    }
  }


  requestAnimationFrame(
    tick
  );
}


/* =========================================================
   SCANSIONE DA FOTO
   ========================================================= */

$('pic').onchange =
  e => {

    const file =
      e.target.files[0];


    if (!file) {
      return;
    }


    const img =
      new Image();


    img.onload =
      () => {

        try {

          const scale =
            Math.min(
              1,
              1600 /
                Math.max(
                  img.width,
                  img.height
                )
            );


          cv.width =
            Math.round(
              img.width *
              scale
            );


          cv.height =
            Math.round(
              img.height *
              scale
            );


          cx.drawImage(
            img,
            0,
            0,
            cv.width,
            cv.height
          );


          const image =
            cx.getImageData(
              0,
              0,
              cv.width,
              cv.height
            );


          const result =
            jsQR(
              image.data,
              image.width,
              image.height,
              {
                inversionAttempts:
                  'attemptBoth'
              }
            );


          if (
            result &&
            result.data
          ) {

            hold = true;

            handle(
              result.data
            );

          } else {

            show(
              'bad',
              '❌ QR NON LETTO',
              [
                'Riprova con più luce.',
                'Tieni il QR completamente visibile.',
                'Evita riflessi sullo schermo.'
              ]
            );


            release(2500);
          }


        } catch(err) {

          show(
            'bad',
            'ERRORE',
            [
              esc(
                err.message
              )
            ]
          );


          release(2500);
        }


        URL.revokeObjectURL(
          img.src
        );
      };


    img.src =
      URL.createObjectURL(
        file
      );


    e.target.value = '';
  };


/* =========================================================
   INSERIMENTO MANUALE
   ========================================================= */

$('manGo').onclick =
  () => {

    let code =
      $('man')
        .value
        .trim()
        .toUpperCase();


    if (!code) {
      return;
    }


    if (
      !code.startsWith(
        'BDAY-'
      )
    ) {

      code =
        'BDAY-' +
        code;
    }


    $('man').value =
      '';


    hold = true;


    handle(
      code
    );
  };


/* =========================================================
   RISULTATO
   ========================================================= */

function show(
  kind,
  title,
  lines,
  extra
){

  $('res').innerHTML =

    `<div class="res ${kind}">

      <h2>
        ${title}
      </h2>

      ${
        lines
          .filter(Boolean)
          .map(
            l =>
              `<p>${l}</p>`
          )
          .join('')
      }

      ${extra || ''}

    </div>`;


  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        kind === 'ok'
          ? 80
          : [120,80,120]
      );
    }

  } catch(e){}
}


/* =========================================================
   SBLOCCA SCANNER
   ========================================================= */

const release =
  ms =>

    setTimeout(
      () => {

        hold = false;

      },
      ms
    );


/* =========================================================
   VERIFICA QR
   ========================================================= */

async function handle(raw){

  show(
    'ok',
    'Verifica in corso…',
    []
  );


  try {

    const r =
      await api(
        'scan',
        {
          code:
            String(raw)
              .trim()
              .toUpperCase()
        }
      );


    const b =
      r.b;


    /*
      QR inesistente.
    */

    if (
      r.status ===
      'invalid'
    ) {

      show(
        'bad',
        '❌ NON VALIDO',
        [
          'Questo QR non è nella lista.'
        ]
      );


      release(2500);

      return;
    }


    const nm =
      esc(
        b.name ||
        b.phone
      );


    /*
      Prenotazione annullata.
    */

    if (
      r.status ===
      'cancelled'
    ) {

      show(
        'bad',
        '❌ ANNULLATO',
        [
          nm,
          'La prenotazione è stata annullata.'
        ]
      );


      release(2500);

      return;
    }


    /*
      Tutti già entrati.
    */

    if (
      r.status ===
      'used'
    ) {

      show(
        'bad',
        '❌ GIÀ UTILIZZATO',
        [
          nm,

          `Tutte le ${b.att.length} persone sono già entrate.`,

          r.last
            ? 'Ultimo ingresso: ' +
              r.last
            : ''
        ]
      );


      release(2500);

      return;
    }


    /*
      Una persona:
      ingresso automatico.
    */

    if (
      b.att.length === 1
    ) {

      admit(
        b,
        [1]
      );

      return;
    }


    /*
      Prenotazione multipla.
    */

    const pending =
      b.att.filter(
        a => !a.e
      );


    show(

      'ok',

      '✅ QR VALIDO',

      [
        nm,

        `Prenotazione per ${b.att.length} persone · già entrate ${b.att.length - pending.length}`,

        'Seleziona chi entra adesso:'
      ],


      `
      <div
        style="
          text-align:left;
          margin:12px 0
        "
      >

        ${
          pending
            .map(
              a =>
                `
                <label
                  style="
                    display:flex;
                    gap:12px;
                    align-items:center;
                    margin:0;
                    padding:10px 0;
                    font-size:18px;
                    color:var(--ink)
                  "
                >

                  <input
                    type="checkbox"
                    class="ck"
                    value="${a.k}"
                    checked
                    style="
                      width:26px;
                      height:26px;
                      padding:0;
                      flex:0 0 auto
                    "
                  >

                  ${esc(
                    a.n ||
                    'Persona ' +
                    a.k
                  )}

                </label>
                `
            )
            .join('')
        }

      </div>


      <button
        class="btn full"
        id="go"
      >
        Conferma ingresso
      </button>
      `
    );


    $('go').onclick =
      () => {

        const indexes =
          [
            ...document
              .querySelectorAll(
                '.ck:checked'
              )
          ]
          .map(
            c =>
              Number(
                c.value
              )
          );


        if (
          !indexes.length
        ) {

          hold = false;

          $('res').innerHTML =
            '';

          return;
        }


        admit(
          b,
          indexes
        );
      };


  } catch(e) {

    show(
      'bad',
      'ERRORE',
      [
        esc(
          e.message
        )
      ]
    );


    release(2500);
  }
}


/* =========================================================
   CONFERMA INGRESSO
   ========================================================= */

async function admit(
  b,
  indexes
){

  try {

    const r =
      await api(
        'admit',
        {
          code:b.code,
          idx:indexes
        }
      );


    if (
      !r.entered.length
    ) {

      show(
        'bad',
        '❌ GIÀ UTILIZZATO',
        [
          esc(
            b.name ||
            b.phone
          ),

          'Già entrato: ' +
          esc(
            r.skipped.join(
              ', '
            )
          )
        ]
      );


    } else {

      show(
        'ok',
        '✅ INGRESSO CONSENTITO',
        [
          esc(
            b.name ||
            b.phone
          ),

          'Entrano: ' +
          esc(
            r.entered.join(
              ', '
            )
          ),

          `Totale entrati ${r.total} su ${r.of}`,

          'Ingresso: ' +
          r.t
        ]
      );
    }


    release(2500);


    /*
      Aggiorna lista/statistiche
      senza interrompere lo scanner.
    */

    refresh()
      .catch(
        () => {}
      );


  } catch(e) {

    show(
      'bad',
      'ERRORE',
      [
        esc(
          e.message
        )
      ]
    );


    release(2500);
  }
}


/* =========================================================
   NAVIGAZIONE
   ========================================================= */

$('nav').onclick =
  e => {

    const t =
      e.target.closest(
        'button'
      );


    if (!t) {
      return;
    }


    document
      .querySelectorAll(
        'nav button'
      )
      .forEach(
        x =>
          x.classList.toggle(
            'on',
            x === t
          )
      );


    $('list').hidden =
      t.dataset.tab !==
      'list';


    $('scan').hidden =
      t.dataset.tab !==
      'scan';


    if (
      t.dataset.tab ===
      'scan'
    ) {

      hold = false;

      startScan();

    } else {

      stopScan();

      refresh()
        .catch(
          () => {}
        );
    }
  };


/* =========================================================
   AVVIO
   ========================================================= */

init();

</script>
